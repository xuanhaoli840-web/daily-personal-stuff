/* ---------- 右侧内容 ---------- */
.main {
  min-width: 0;
  overflow-y: auto;
  background:
    radial-gradient(620px 300px at 100% 0%, rgba(99, 102, 241, 0.055), transparent 70%),

.lede {

.card {

.learning-level {

.tool-table-wrap { overflow-x:auto; border:1px solid var(--border); border-radius:8px; background:#fff; }
.tool-table { width:100%; border-collapse:collapse; min-width:650px; font-size:12px; }
.tool-table th,.tool-table td { padding:11px 12px; border-bottom:1px solid var(--border); text-align:left; vertical-align:top; line-height:1.6; }
.tool-table th { background:#f1f5f9; color:var(--text-2); }
.tool-table tr:last-child td { border-bottom:0; }
.tool-link { border:0; padding:0; background:none; color:#2563eb; font:inherit; cursor:pointer; text-align:left; }
.coverage-status { display:inline-block; padding:3px 7px; border-radius:99px; background:#fffbeb; color:#92400e; font-size:11px; font-weight:750; white-space:nowrap; }
.coverage-status.full { background:#ecfdf5; color:#047857; }
.coverage-status.none { background:#fff1f2; color:#be123c; }
.exam-item { border:1px solid var(--border); border-radius:8px; background:#fff; margin-bottom:10px; }
.exam-item summary { padding:14px 16px; cursor:pointer; font-weight:750; color:var(--text); }
.exam-body { padding:0 16px 16px; color:var(--text-2); font-size:13px; line-height:1.75; }
.exam-body h3 { margin:12px 0 5px; color:var(--text); font-size:12px; }
.exam-body pre { overflow:auto; padding:12px; border-radius:7px; background:var(--code-bg); color:var(--code-text); font:12px/1.65 var(--mono); }
.exam-body .exam-code { margin-top:8px; }
.exam-body .exam-line-list { display:grid; gap:6px; margin:8px 0 0; padding-left:23px; }
.exam-body .exam-line-list li { padding-left:3px; line-height:1.7; }
.exam-body .exam-output { padding:9px 11px; border-left:3px solid #818cf8; border-radius:6px; background:#eef2ff; color:#312e81; font-family:var(--mono); white-space:pre-wrap; }
.exam-body .exam-variant { padding:10px 11px; border-left:3px solid #14b8a6; border-radius:6px; background:#ecfdf5; color:#115e59; }
.wrong-item { margin-bottom:12px; }
.wrong-item pre { overflow:auto; max-height:240px; padding:12px; border-radius:7px; background:var(--code-bg); color:var(--code-text); white-space:pre-wrap; }
.wrong-actions { display:flex; gap:8px; flex-wrap:wrap; }
.variation-card { border-color:#c7d2fe; background:#fafaff; }
.variation-list { display:grid; gap:9px; margin-top:10px; }
.variation-list details { border:1px solid #e0e7ff; border-radius:8px; background:#fff; }
.variation-list summary { padding:11px 13px; color:#3730a3; font-size:12px; font-weight:750; cursor:pointer; }
.variation-list p { margin:0; padding:0 13px 12px; color:var(--text-2); font-size:12px; line-height:1.75; }
.variation-exercise { margin:10px 13px 13px; padding:12px; border:1px solid #e0e7ff; border-radius:8px; background:#fff; }
.variation-exercise h4 { margin:0 0 7px; color:#3730a3; font-size:12px; }
.variation-prompt { margin:0 0 9px; color:var(--text-2); font-size:12px; line-height:1.7; }
.variation-editor { width:100%; min-height:110px; resize:vertical; padding:10px; border:1px solid #cbd5e1; border-radius:7px; background:#0f172a; color:#e2e8f0; font:12px/1.7 var(--mono); box-sizing:border-box; }
.variation-toolbar { display:flex; gap:7px; flex-wrap:wrap; align-items:center; margin-top:8px; }
.variation-result { margin-top:8px; padding:8px 10px; border-radius:6px; font-size:11.5px; line-height:1.6; white-space:pre-wrap; }
.variation-result.ok { background:#ecfdf5; color:#047857; }
.variation-result.bad { background:#fff1f2; color:#be123c; }
.example-purpose { margin:0 0 13px; padding:11px 12px; border-left:3px solid #6366f1; border-radius:6px; background:#eef2ff; color:#3730a3; font-size:12.5px; line-height:1.75; }
.example-preview { margin:14px 0 12px; padding:12px 14px; border:1px solid #c7d2fe; border-radius:9px; background:linear-gradient(135deg,#f5f7ff,#fff); color:#334155; }
.example-preview strong { display:block; margin-bottom:5px; color:#4338ca; font-size:11.5px; }
.example-preview p { margin:0; font-size:12.5px; line-height:1.75; }
.example-flow { margin:0 0 12px; padding:10px 12px; border:1px solid #dbeafe; border-radius:7px; background:#f8fbff; color:#334155; font-size:12px; line-height:1.7; }
.example-output { margin-top:12px; padding:10px 12px; border:1px solid #bbf7d0; border-radius:7px; background:#f0fdf4; color:#166534; font:12px/1.65 var(--mono); white-space:pre-wrap; }
.tool-nav button[data-tool="wall"] { grid-column:1 / -1; }
.note-wall-head { margin-bottom:18px; }
.note-wall-grid { display:grid; grid-template-columns:minmax(0, 1fr) minmax(260px, .78fr); gap:14px; align-items:start; }
.note-wall-form textarea { width:100%; min-height:145px; resize:vertical; padding:12px; border:1px solid var(--border-strong); border-radius:8px; background:#fff; color:var(--text); font:inherit; font-size:13px; line-height:1.7; }
.note-wall-form input,.note-wall-form select { width:100%; min-height:40px; margin:5px 0 10px; padding:7px 9px; border:1px solid var(--border-strong); border-radius:7px; background:#fff; color:var(--text); font:inherit; }
.note-wall-form label { display:block; margin-top:8px; color:var(--text-2); font-size:11.5px; font-weight:700; }
.note-wall-hint { margin:9px 0 0; color:var(--muted); font-size:11px; line-height:1.6; }
.note-wall-list { display:grid; gap:10px; }
.note-card { position:relative; padding:13px; border:1px solid #f1dfaa; border-radius:8px; background:#fffdf3; box-shadow:0 4px 12px rgba(120,90,20,.04); }
.note-card:nth-child(3n+2) { border-color:#c7e9df; background:#f4fffb; }
.note-card:nth-child(3n) { border-color:#d9d2fb; background:#faf8ff; }
.note-card-head { display:flex; justify-content:space-between; gap:10px; margin-bottom:8px; color:#7c5b12; font-size:10.5px; font-weight:750; }
.note-card p { margin:0; color:var(--text-2); font-size:13px; line-height:1.75; white-space:pre-wrap; overflow-wrap:anywhere; }
.note-card button { margin-top:8px; border:0; background:none; color:#2563eb; font:inherit; font-size:11px; cursor:pointer; }
.note-wall-empty { padding:24px 16px; border:1px dashed var(--border-strong); border-radius:8px; color:var(--muted); text-align:center; font-size:12px; }
@media (max-width:760px) { .note-wall-grid { grid-template-columns:1fr; } }
.exercise-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  padding: 20px 22px 0;
}
.exercise-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 8px;
  padding: 4px 9px;
  border-radius: 99px;
  background: var(--accent-soft);
  color: #4338ca;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.12em;
}
.exercise-badge::before {
  content: "";
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: #6366f1;
}
.ex-title {
  margin: 0;
  color: #172033;
  font-size: 20px;
  line-height: 1.4;
  letter-spacing: -0.015em;
}
.mark-btn {
  flex: none;
  padding: 7px 12px;
  border: 1px solid var(--border-strong);
  border-radius: 99px;
  background: #fff;
  color: #64748b;
  font-family: inherit;
  font-size: 11.5px;
  font-weight: 650;
  white-space: nowrap;
  cursor: pointer;
  transition: border-color 0.15s ease, background 0.15s ease, color 0.15s ease;
}
.mark-btn:hover { border-color: #94a3b8; color: #334155; }
.mark-btn.done {
  border-color: var(--ok-line);
  background: var(--ok-soft);
  color: #047857;
  font-weight: 750;
}
.ex-prompt {
  margin: 10px 22px 16px;
  color: #334155;
  font-size: 14px;
  line-height: 1.85;
}
.practice-context {
  display: grid;
  gap: 10px;
  margin: 14px 22px 0;
  padding: 14px;
  border: 1px solid #dce6fb;
  border-radius: 12px;
  background: #f7f9ff;
}
.context-row {
  display: grid;
  grid-template-columns: 68px minmax(0, 1fr);
  gap: 10px;
  align-items: start;
}
.context-label,
.task-label,
.criteria-title {
  color: #4f46e5;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.08em;
}
.context-row p {
  margin: 0;
  color: #4b5870;
  font-size: 12.5px;
  line-height: 1.72;
}
.task-block {
  margin: 14px 22px 16px;
}
.task-label { margin-bottom: 6px; }
.task-block .ex-prompt { margin: 0; }
.criteria-box {
  margin: 0 22px 16px;
  padding: 12px 14px;
  border: 1px solid #e5eaf4;
  border-radius: 12px;
  background: #fbfcfe;
}
.hint-box {
  margin: 0 22px 16px;
  padding: 10px 13px;
  border: 1px solid #f1e4c4;
  border-radius: 10px;
  background: #fffdf6;
}
.hint-box summary {
  color: #9a6700;
  font-size: 11.5px;
  font-weight: 700;
  cursor: pointer;
}
.hint-box p {
  margin: 8px 0 0;
  color: #6b6252;
  font-size: 12px;
  line-height: 1.7;
}
.criteria-title { margin-bottom: 7px; color: #64748b; }
.criteria-list {
  display: grid;
  gap: 5px;
  margin: 0;
  padding: 0;
  list-style: none;
}
.criteria-list li {
  position: relative;
  padding-left: 17px;
  color: #59667a;
  font-size: 12px;
  line-height: 1.6;
}
.criteria-list li::before {
  content: "";
  position: absolute;
  left: 1px;
  top: 7px;
  width: 6px;
  height: 6px;
  border: 1.5px solid #a5b4fc;
  border-radius: 50%;
}

.expected-wrap {
  margin: 0 22px 16px;
  padding: 12px 14px;
  border: 1px solid #d6eee3;
  border-radius: 12px;
  background: linear-gradient(135deg, #f5fdf9 0%, #effaf5 100%);
}
.expected-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 6px;
}
.expected-label {
  color: #0f766e;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.12em;
}
.expected-badge {
  padding: 2px 7px;
  border: 1px solid #bbf7d0;
  border-radius: 99px;
  background: #dcfce7;
  color: #0f766e;
  font-size: 9.5px;
  font-weight: 700;
}
pre.expected {
  margin: 0;
  color: #14532d;
  font-family: var(--mono);
  font-size: 13px;
  line-height: 1.7;
  white-space: pre-wrap;
}
.expected-note {
  margin-top: 7px;
  color: #78998b;
  font-size: 10.5px;
  line-height: 1.6;
}

.editor-shell {
  margin: 0 22px;
  overflow: hidden;
  border: 1px solid #cfd8e3;
  border-radius: 12px;
  background: #fff;
  transition: border-color 0.18s ease, box-shadow 0.18s ease;
}
.editor-shell:focus-within {
  border-color: #6366f1;
  box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.11), 0 8px 22px rgba(79, 70, 229, 0.08);
}
.editor-top {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 8px 13px;
  border-bottom: 1px solid #eef2f7;
  background: #f8fafc;
}
.editor-prompt {
  color: #6366f1;
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 700;
}
.editor-file {
  color: #64748b;
  font-family: var(--mono);
  font-size: 11px;
}
.editor-tip {
  margin-left: auto;
  color: #9aa6b7;
  font-size: 10px;
}
.editor-wrap {
  overflow: hidden;
  border: 0;
  border-radius: 0;
  background: #fff;
}
#editor {
  display: block;
  width: 100%;
  min-height: 180px;
  padding: 16px 18px;
  border: 0;
  outline: none;
  resize: vertical;
  background: #fff;
  color: #0f172a;
  font-family: var(--mono);
  font-size: 13.5px;
  line-height: 1.75;
  tab-size: 4;
  white-space: pre-wrap;
  overflow-wrap: break-word;
}

.toolbar {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 9px;
  padding: 14px 22px 20px;
}
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 9px 16px;
  border: 1px solid var(--border-strong);
  border-radius: 10px;
  background: #fff;
  color: var(--text-2);
  font-family: inherit;
  font-size: 13px;
  font-weight: 650;
  cursor: pointer;
  transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease, border-color 0.15s ease;
}
.btn:hover {
  border-color: #b9c5d6;
  background: #f8fafc;
  transform: translateY(-1px);
  box-shadow: 0 5px 12px rgba(15, 23, 42, 0.06);
}
.btn:active { transform: translateY(0); box-shadow: none; }
.btn-primary {
  border-color: transparent;
  background: linear-gradient(135deg, #4f46e5, #2563eb);
  color: #fff;
  box-shadow: 0 8px 18px rgba(79, 70, 229, 0.24);
}
.btn-primary:hover {
  border-color: transparent;
  background: linear-gradient(135deg, #4338ca, #1d4ed8);
  box-shadow: 0 11px 24px rgba(79, 70, 229, 0.3);
}
.btn-small {
  padding: 5px 10px;
  border-radius: 8px;
  font-size: 11.5px;
}
.btn:disabled { opacity: 0.42; cursor: not-allowed; }
.btn:disabled:hover {
  border-color: var(--border-strong);
  background: #fff;
  transform: none;
  box-shadow: none;
}
.shortcut-hint {
  margin-left: auto;
  color: #9aa6b7;
  font-size: 10.5px;
}

.btn-run {
  border-color: #99f6e4;
  background: #f0fdfa;
  color: #0f766e;
}
.runtime-panel {
  margin: 0 22px 14px;
  overflow: hidden;
  border: 1px solid #334155;
  border-radius: 12px;
  background: #0f172a;
}
.runtime-panel[hidden] { display: none; }
.runtime-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 9px 13px;
  border-bottom: 1px solid #334155;
  color: #94a3b8;
  font-size: 10.5px;
}
.runtime-status { color: #5eead4; font-weight: 750; }
.runtime-output {
  min-height: 62px;
  max-height: 260px;
  margin: 0;
  padding: 13px;
  overflow: auto;
  color: #e2e8f0;
  font: 12.5px/1.7 var(--mono);
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  -webkit-overflow-scrolling: touch;
}
.runtime-output.error { color: #fda4af; }
.runtime-help {
  padding: 0 13px 12px;
  color: #fda4af;
  font-size: 11.5px;
  line-height: 1.7;
}

.result {
  margin: 0 22px 20px;
  padding: 15px 17px;
  border: 1px solid;
  border-radius: 12px;
}
.result[hidden] { display: none; }
.result-ok { border-color: var(--ok-line); background: var(--ok-soft); }
.result-bad { border-color: var(--bad-line); background: var(--bad-soft); }
.result-warn { border-color: var(--warn-line); background: var(--warn-soft); }
.result-title {
  display: flex;
  align-items: center;
  gap: 9px;
  margin-bottom: 9px;
  font-size: 13.5px;
  font-weight: 800;
}
.result-title::before {
  display: grid;
  place-items: center;
  width: 20px;
  height: 20px;
  flex: none;
  border-radius: 50%;
  color: #fff;
  font-size: 11px;
  font-weight: 800;
}
.result-ok .result-title { color: #047857; }
.result-ok .result-title::before { content: "✓"; background: #10b981; }
.result-bad .result-title { color: #be123c; }
.result-bad .result-title::before { content: "✕"; background: #e11d48; }
.result-warn .result-title { color: #b45309; }
.result-warn .result-title::before { content: "!"; background: #f59e0b; }
.check-list {
  display: grid;
  gap: 3px;
  margin: 10px 0 8px;
  padding: 0;
  list-style: none;
  font-size: 12.5px;
  line-height: 1.85;
}
.check-list .ok { color: #047857; }
.check-list .bad { color: #be123c; }
.result-explain {
  margin: 6px 0 0;
  color: #526074;
  font-size: 12.5px;
  line-height: 1.85;
}
.result-next { margin-top: 12px; }

.pager {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-top: 30px;
  padding-top: 20px;
  border-top: 1px solid var(--border);
}
.pager .pos {
  color: var(--faint);
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.05em;
  font-variant-numeric: tabular-nums;
}

.toast {
  position: fixed;
  left: 50%;
  bottom: 30px;
  z-index: 50;
  padding: 10px 18px;
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 10px;
  background: rgba(15, 23, 42, 0.94);
  color: #fff;
  font-size: 12.5px;
  box-shadow: 0 14px 34px rgba(15, 23, 42, 0.24);
  opacity: 0;
  pointer-events: none;
  transform: translate(-50%, 10px);
  transition: opacity 0.18s ease, transform 0.18s ease;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

.resume-note {
  display: flex;
  align-items: flex-start;
  gap: 9px;
  margin-bottom: 16px;
  padding: 10px 13px;
  border: 1px solid #d6eee3;
  border-radius: 12px;
  background: #f3fbf7;
  color: #35695b;
  font-size: 11.5px;
  line-height: 1.65;
}
.resume-note::before {
  content: "✓";
  display: grid;
  place-items: center;
  width: 18px;
  height: 18px;
  flex: none;
  margin-top: 1px;
  border-radius: 50%;
  background: #d1fae5;
  color: #047857;
  font-size: 10px;
  font-weight: 800;
}

button:focus-visible {
  outline: 2px solid #818cf8;
  outline-offset: 2px;
}

/* ---------- 新手引导与逐步讲解 ---------- */
.intro-card {
  margin-bottom: 18px;
  padding: 18px 20px;
  border: 1px solid #dbe3ff;
  border-radius: 16px;
  background: linear-gradient(135deg, #f7f8ff 0%, #eef3ff 100%);
  box-shadow: var(--shadow-sm);
}
.intro-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 8px;
}
.intro-kicker {
  display: flex;
  align-items: center;
  gap: 7px;
  color: #4f46e5;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.14em;
}
.intro-kicker::before {
  content: "";
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #6366f1;
}
.intro-count { color: #7c89a0; font-size: 10px; }
.intro-goal {
  margin: 0 0 12px;
  color: #3f4c63;
  font-size: 13.5px;
  line-height: 1.85;
}

.chapter-showcase {
  margin-top: 20px;
  padding: 20px;
  border: 1px solid #c7d2fe;
  border-radius: 18px;
  background: linear-gradient(145deg, #eef2ff 0%, #ffffff 58%, #ecfeff 100%);
  box-shadow: 0 14px 30px rgba(49, 46, 129, .08);
}

.showcase-copy h3 {
  margin: 6px 0 8px;
  color: #1e1b4b;
  font-size: 1.08rem;
}

.showcase-copy p,
.showcase-takeaway { line-height: 1.75; }

.showcase-kicker {
  color: #4338ca;
  font-size: .78rem;
  font-weight: 800;
  letter-spacing: .08em;
}

.showcase-code {
  margin-top: 14px;
  overflow-x: auto;
  border-radius: 13px;
  background: #111827;
  color: #e5e7eb;
  -webkit-overflow-scrolling: touch;
}

.showcase-code pre,
.showcase-result pre {
  margin: 0;
  padding: 15px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  font: 13px/1.7 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

.showcase-result {
  margin-top: 10px;
  border: 1px solid #bae6fd;
  border-radius: 12px;
  background: rgba(255,255,255,.82);
}

.showcase-result > span {
  display: block;
  padding: 9px 14px 0;
  color: #0369a1;
  font-size: .76rem;
  font-weight: 800;
}

.showcase-result pre { padding-top: 7px; color: #0f172a; }

.showcase-takeaway {
  margin-top: 12px;
  padding: 11px 13px;
  border-left: 4px solid #14b8a6;
  border-radius: 8px;
  background: rgba(240, 253, 250, .9);
  color: #134e4a;
  font-size: .9rem;
}

@media (max-width: 480px) {
  .chapter-showcase { padding: 15px; border-radius: 15px; }
  .showcase-code pre, .showcase-result pre { padding: 12px; font-size: 12px; }
  .showcase-result > span { padding-left: 12px; }
}
.intro-path {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
}
.path-item {

  function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
    });
  }

  function highlightPython(code) {
    var keywords = ['def', 'return', 'if', 'elif', 'else', 'for', 'while', 'in', 'and', 'or', 'not', 'True', 'False', 'None', 'break', 'continue', 'import', 'from', 'as', 'class', 'try', 'except', 'finally', 'with', 'lambda', 'pass', 'global', 'nonlocal', 'is', 'raise', 'yield'];
    var builtins = ['print', 'len', 'range', 'int', 'float', 'str', 'sum', 'max', 'min', 'sorted', 'list', 'dict', 'set', 'tuple', 'type', 'input', 'abs', 'round', 'enumerate', 'zip', 'append', 'strip', 'upper', 'lower', 'split', 'replace', 'join', 'count', 'pop', 'remove', 'insert', 'extend', 'get', 'items', 'keys', 'values'];
    var html = '';
    var i = 0;

    function escapeToken(text) {
      return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    while (i < code.length) {
      var ch = code[i];

      if (ch === '#') {
        var commentEnd = code.indexOf('\n', i);
        if (commentEnd === -1) commentEnd = code.length;
        html += '<span class="tok-com">' + escapeToken(code.slice(i, commentEnd)) + '</span>';
        i = commentEnd;
        continue;
      }

      if (ch === '"' || ch === "'") {
        var quote = ch;
        var end = i + 1;
        if (code.slice(i, i + 3) === quote + quote + quote) {
          end = i + 3;
          while (end < code.length && code.slice(end, end + 3) !== quote + quote + quote) end++;
          end = Math.min(code.length, end + 3);
        } else {
          while (end < code.length) {
            if (code[end] === '\\') { end += 2; continue; }
            if (code[end] === quote) { end++; break; }
            if (code[end] === '\n') break;
            end++;
          }
        }
        html += '<span class="tok-str">' + escapeToken(code.slice(i, end)) + '</span>';
        i = end;
        continue;
      }

      if (/[0-9]/.test(ch)) {
        var numberEnd = i + 1;
        while (numberEnd < code.length && /[0-9._]/.test(code[numberEnd])) numberEnd++;
        html += '<span class="tok-num">' + escapeToken(code.slice(i, numberEnd)) + '</span>';
        i = numberEnd;
        continue;
      }

      if (/[A-Za-z_]/.test(ch)) {
        var wordEnd = i + 1;
        while (wordEnd < code.length && /[A-Za-z0-9_]/.test(code[wordEnd])) wordEnd++;
        var word = code.slice(i, wordEnd);
        var tokenClass = keywords.indexOf(word) !== -1 ? 'tok-kw' : (builtins.indexOf(word) !== -1 ? 'tok-fn' : '');
        html += tokenClass ? '<span class="' + tokenClass + '">' + escapeToken(word) + '</span>' : escapeToken(word);
        i = wordEnd;
        continue;
      }

      html += escapeToken(ch);
      i++;
    }
    return html;
  }

  function variantById(point, id) {

  async function runVariant(point, id, shouldCheck) {
    var exercise = variantById(point, id);
    if (!exercise) return;
    var editor = document.getElementById('variant-editor-' + id);
    var result = document.getElementById('variant-result-' + id);
    var runtime = document.getElementById('variant-runtime-' + id);
    if (!editor || !result || !runtime) return;
    var code = editor.value;
    if (!code.trim()) {
      result.hidden = false;
      result.className = 'variation-result bad';
      result.textContent = '编辑区是空的，请先写代码。';
      return;
    }
    var runButton = mainInner.querySelector('[data-variant-run="' + id + '"]');
    var checkButton = mainInner.querySelector('[data-variant-check="' + id + '"]');
    if (runButton) runButton.disabled = true;
    if (checkButton) checkButton.disabled = true;
    var output = await executePython(code);
    if (runButton) runButton.disabled = false;
    if (checkButton) checkButton.disabled = false;
    runtime.hidden = false;
    runtime.textContent = output.ok ? (output.stdout || '（程序运行成功，但没有输出）') : (output.error || '运行失败');
    runtime.className = 'variation-result ' + (output.ok ? 'ok' : 'bad');
    if (!shouldCheck) return;
    if (!output.ok) {
      result.hidden = false;
      result.className = 'variation-result bad';
      result.textContent = '提交失败：代码没有成功运行。请根据上方报错修改后重试。';
      if (!output.infrastructure) recordWrong(exercise, code, /SyntaxError|IndentationError|TabError/.test(output.error || '') ? '变式编译/语法错误' : '变式运行错误');
      noteStudyDay();
      renderSidebar();
      return;
    }
    var clean = normalizeCode(code);
    var outputMatches = normalizeOutput(output.stdout) === normalizeOutput(exercise.expected);
    var checks = [{ label: '运行输出与预期一致', ok: outputMatches }].concat(exercise.checks.map(function (check) {
      var ok = false;
      try { ok = !!check.test(clean); } catch (err) { ok = false; }
      return { label: check.label, ok: ok };
    }));
    var passed = checks.every(function (check) { return check.ok; });
    result.hidden = false;
    result.className = 'variation-result ' + (passed ? 'ok' : 'bad');
    result.textContent = (passed ? '提交通过！这道变式题已完成。\n' : '还需要修改：\n') + checks.map(function (check) { return (check.ok ? '✓ ' : '✗ ') + check.label; }).join('\n');
    if (passed) {
      delete state.wrong[exercise.id];
      noteStudyDay();
    } else {
      recordWrong(exercise, code, outputMatches ? '变式要求未满足' : '变式输出不匹配');
      noteStudyDay();
    }
    renderSidebar();
  }

  function bindVariantExercises(point) {

      editor.value = Object.prototype.hasOwnProperty.call(state.drafts, exercise.id) ? state.drafts[exercise.id] : exercise.starter;
      editor.addEventListener('input', function () { state.drafts[exercise.id] = editor.value; persist(); });
      editor.addEventListener('keydown', function (event) {
        if ((event.ctrlKey || event.metaKey) && event.key === 'Enter') { event.preventDefault(); runVariant(point, exercise.id, false); return; }
        if (event.key === 'Tab') {
          event.preventDefault();
          var start = editor.selectionStart, end = editor.selectionEnd, value = editor.value;
          editor.value = value.slice(0, start) + '    ' + value.slice(end);
          editor.selectionStart = editor.selectionEnd = start + 4;
          state.drafts[exercise.id] = editor.value;
          persist();
        }
      });
      var run = mainInner.querySelector('[data-variant-run="' + exercise.id + '"]');
      var check = mainInner.querySelector('[data-variant-check="' + exercise.id + '"]');
      var reset = mainInner.querySelector('[data-variant-reset="' + exercise.id + '"]');

  var pythonWorker = null;
  var pythonRequest = null;
  var pythonRequestId = 0;
  var pythonEngineReady = false;

  function createPythonWorker() {
    if (pythonWorker) pythonWorker.terminate();
    var pythonBase = new URL('./pyodide/', location.href).href;
    var source = [
      'var enginePromise = null;',
      'self.onmessage = async function (event) {',
      '  var data = event.data;',
      '  try {',
      '    if (!enginePromise) {',
      '      self.postMessage({ id: data.id, phase: "loading" });',
      '      var indexURL = ' + JSON.stringify(pythonBase) + ';',
      '      importScripts(indexURL + "pyodide.js");',
      '      enginePromise = loadPyodide({ indexURL: indexURL });',
      '    }',
      '    var pyodide = await enginePromise;',
      '    self.postMessage({ id: data.id, phase: "running" });',
      '    var stdout = [];',
      '    var stderr = [];',
      '    pyodide.setStdout({ batched: function (text) { stdout.push(text); } });',
      '    pyodide.setStderr({ batched: function (text) { stderr.push(text); } });',
      '    await pyodide.runPythonAsync(data.code);',
      '    self.postMessage({ id: data.id, ok: true, stdout: stdout.join("\\n"), stderr: stderr.join("\\n") });',
      '  } catch (error) {',
      '    self.postMessage({ id: data.id, ok: false, error: String(error && error.message ? error.message : error) });',
      '  }',
      '};'
    ].join('\n');
    var url = URL.createObjectURL(new Blob([source], { type: 'text/javascript' }));
    pythonWorker = new Worker(url);
    URL.revokeObjectURL(url);
    pythonWorker.onmessage = function (event) {
      var data = event.data || {};
      if (!pythonRequest || data.id !== pythonRequest.id) return;
      if (data.phase) {
        updateRuntimePhase(data.phase);
        if (data.phase === 'running') pythonEngineReady = true;
        return;
      }
      clearTimeout(pythonRequest.timer);
      var resolve = pythonRequest.resolve;
      pythonRequest = null;
      resolve(data);
    };
    pythonWorker.onerror = function () {
      if (!pythonRequest) return;
      clearTimeout(pythonRequest.timer);
      var resolve = pythonRequest.resolve;
      pythonRequest = null;
      resolve({ ok: false, infrastructure: true, error: 'Python 运行组件加载失败，请检查网络后重试。' });
    };
  }

  function executePython(code) {
    if (!pythonWorker) createPythonWorker();
    if (pythonRequest) return Promise.resolve({ ok: false, infrastructure: true, error: '已有代码正在运行，请稍候。' });
    return new Promise(function (resolve) {
      var id = ++pythonRequestId;
      var timeout = pythonEngineReady ? 8000 : 35000;
      var timer = setTimeout(function () {
        if (!pythonRequest || pythonRequest.id !== id) return;
        pythonWorker.terminate();
        pythonWorker = null;
        pythonEngineReady = false;
        pythonRequest = null;
        resolve({ ok: false, timeout: true, error: '运行时间过长，已自动停止。请检查 while 条件或循环是否能结束。' });
      }, timeout);
      pythonRequest = { id: id, resolve: resolve, timer: timer };
      pythonWorker.postMessage({ id: id, code: code });
    });
  }

  function updateRuntimePhase(phase) {
    var panel = document.getElementById('runtimePanel');
    var status = document.getElementById('runtimeStatus');
    var output = document.getElementById('runtimeOutput');
    if (!panel || !status || !output) return;
    panel.hidden = false;
    status.textContent = phase === 'loading' ? '首次加载 Python…' : '正在运行…';
    output.className = 'runtime-output';
    output.textContent = phase === 'loading'
      ? '首次运行需要加载浏览器版 Python，之后通常会使用缓存。'
      : '代码正在独立环境中执行。';
  }

  function explainPythonError(errorText) {
    var text = String(errorText || '');
    var lineMatch = text.match(/line\s+(\d+)/i);
    var line = lineMatch ? Number(lineMatch[1]) : 0;
    var advice = '查看报错最后一行，它通常包含错误类型和直接原因。';
    if (/IndentationError|TabError/.test(text)) advice = '缩进有问题。检查报错行及上一行，代码块通常统一缩进 4 个空格。';
    else if (/SyntaxError/.test(text)) advice = '语法不完整。重点检查报错行附近的冒号、括号、引号和拼写。';
    else if (/NameError/.test(text)) advice = '使用了尚未定义的名称。检查变量或函数的拼写，以及是否在使用前赋值。';
    else if (/TypeError/.test(text)) advice = '数据类型或参数不匹配。检查传入值的类型和函数参数数量。';
    else if (/ZeroDivisionError/.test(text)) advice = '出现除以零。计算前应判断分母是否为 0。';
    else if (/IndexError/.test(text)) advice = '列表下标超出范围。可先用 len() 检查列表长度。';
    else if (/KeyError/.test(text)) advice = '字典中没有这个键。不确定键是否存在时可以使用 get()。';
    return { line: line, advice: advice };
  }

  function showRuntime(result) {
    var panel = document.getElementById('runtimePanel');
    var status = document.getElementById('runtimeStatus');
    var output = document.getElementById('runtimeOutput');
    var help = document.getElementById('runtimeHelp');
    if (!panel || !status || !output || !help) return;
    panel.hidden = false;
    if (result.ok) {
      status.textContent = '运行完成';
      output.className = 'runtime-output';
      output.textContent = (result.stdout || result.stderr || '').trim() || '（程序运行成功，但没有输出）';
      help.hidden = true;
      help.textContent = '';
    } else {
      var info = explainPythonError(result.error);
      status.textContent = result.timeout ? '已停止' : '运行出错';
      output.className = 'runtime-output error';
      output.textContent = result.error || '未知运行错误';
      help.hidden = false;
      help.textContent = (info.line ? '第 ' + info.line + ' 行附近：' : '') + info.advice;
      if (info.line) focusEditorLine(info.line);
    }
  }

  function focusEditorLine(lineNumber) {
    var editor = document.getElementById('editor');
    if (!editor || lineNumber < 1) return;
    var lines = editor.value.split('\n');
    var start = 0;
    for (var i = 0; i < lineNumber - 1 && i < lines.length; i++) start += lines[i].length + 1;
    var end = start + (lines[lineNumber - 1] || '').length;
    editor.focus();
    editor.setSelectionRange(start, end);
  }

  function setRunBusy(busy) {
    ['runBtn', 'checkBtn'].forEach(function (id) {
      var button = document.getElementById(id);
      if (button) button.disabled = busy;
    });
  }

  async function runOnly() {
    var editor = document.getElementById('editor');
    if (!editor || !editor.value.trim()) {
      showRuntime({ ok: false, infrastructure: true, error: '编辑区是空的，请先写代码。' });
      return;
    }
    setRunBusy(true);
    var result = await executePython(editor.value);
    setRunBusy(false);
    showRuntime(result);
  }

  function normalizeOutput(value) {
    return String(value == null ? '' : value)
      .replace(/\\n/g, '\n')
      .replace(/\r\n?/g, '\n')
      .split('\n')
      .map(function (line) { return line.replace(/[ \t]+$/g, ''); })
      .join('\n')
      .trim();
  }

  function normalizeCode(code) {
    return String(code)
      .replace(/\r\n?/g, '\n')
      .split('\n')
      .map(function (line) { return line.replace(/#.*$/, ''); })
      .join('\n');
  }

  async function runCheck() {
    var editor = document.getElementById('editor');
    if (!editor) return;
    var exercise = FLAT_POINTS[currentIndex].point.exercise;
    var clean = normalizeCode(editor.value);
    var box = document.getElementById('result');
    box.hidden = false;

    if (!clean.trim()) {
      box.className = 'result result-warn';
      box.innerHTML = '<div class="result-title">先写点代码再检查</div>' +
        '<p class="result-explain">编辑区现在是空的。照着上面的示例写几行，再点“检查答案”。</p>';
      return;
    }

    setRunBusy(true);
    var runtime = await executePython(editor.value);
    setRunBusy(false);
    showRuntime(runtime);
    if (!runtime.ok) {
      if (!runtime.infrastructure) {
        var errorKind = /SyntaxError|IndentationError|TabError/.test(runtime.error || '') ? '编译/语法错误' : '运行错误';
        recordWrong(exercise, editor.value, errorKind);
      }
      noteStudyDay();
      renderSidebar();
      box.className = 'result result-bad';
      box.innerHTML = '<div class="result-title">代码还没有成功运行</div>' +
        '<p class="result-explain">先根据上方真实报错修改代码。程序能运行后，系统才会继续核对答案。</p>';
      return;
    }

    var outputMatches = normalizeOutput(runtime.stdout) === normalizeOutput(exercise.expected);
    var checks = [{ label: '真实运行输出与预期结果一致', ok: outputMatches }].concat(exercise.checks.map(function (check) {
      var ok = false;
      try { ok = !!check.test(clean); } catch (err) { ok = false; }
      return { label: check.label, ok: ok };
    }));
    var passed = checks.every(function (check) { return check.ok; });
    var failedCount = checks.filter(function (check) { return !check.ok; }).length;

    if (passed) {
      box.className = 'result result-ok';
      box.innerHTML =
        '<div class="result-title">检查通过，本题已标记完成</div>' +
        '<ul class="check-list">' + checks.map(function (check) {
          return '<li class="ok">✓ ' + escapeHtml(check.label) + '</li>';
        }).join('') + '</ul>' +
        '<p class="result-explain"><strong>为什么这样写：</strong>' + exercise.explain + '</p>' +
        (currentIndex < FLAT_POINTS.length - 1
          ? '<button class="btn result-next" id="nextFromResult" type="button">下一节 →</button>'
          : '<p class="result-explain">所有知识点都学完了，可以回到任意一节复习。</p>');
      var nextFromResult = document.getElementById('nextFromResult');
      if (nextFromResult) {
        nextFromResult.addEventListener('click', function () { goTo(currentIndex + 1); });
      }
      setCompleted(exercise.id, true, { silent: true });
    } else {
      recordWrong(exercise, editor.value, outputMatches ? '练习要求未满足' : '输出不匹配');
      noteStudyDay();
      renderSidebar();
      box.className = 'result result-bad';
      box.innerHTML =
        '<div class="result-title">还差 ' + failedCount + ' 项，再改改</div>' +
        '<ul class="check-list">' + checks.map(function (check) {
          return '<li class="' + (check.ok ? 'ok' : 'bad') + '">' + (check.ok ? '✓' : '✗') + ' ' + escapeHtml(check.label) + '</li>';
        }).join('') + '</ul>' +
        '<p class="result-explain">提示：' + exercise.hint + '</p>' +
        (outputMatches ? '' : '<p class="result-explain"><strong>实际输出：</strong><br><code>' + escapeHtml(normalizeOutput(runtime.stdout) || '（无输出）') + '</code><br><strong>预期输出：</strong><br><code>' + escapeHtml(normalizeOutput(exercise.expected)) + '</code></p>') +
        '<p class="result-explain">系统已经真实运行代码，并继续检查是否使用了本题要求的知识点。对照失败项逐个修改即可。</p>';
    }
  }

  function resetEditor() {
    var exercise = FLAT_POINTS[currentIndex].point.exercise;
    var editor = document.getElementById('editor');
    editor.value = exercise.starter;
    state.drafts[exercise.id] = exercise.starter;
    persist();
    var box = document.getElementById('result');
    box.hidden = true;
    box.innerHTML = '';
    var runtimePanel = document.getElementById('runtimePanel');
    if (runtimePanel) runtimePanel.hidden = true;
    editor.focus();
    showToast('已重置为初始代码');
  }

  function handleEditorKeydown(event) {
    var editor = event.currentTarget;
    var start = editor.selectionStart;
    var end = editor.selectionEnd;
    var value = editor.value;

    if (event.key === 'Tab') {
      event.preventDefault();
      if (!event.shiftKey) {
        if (start === end) {
          editor.value = value.slice(0, start) + '    ' + value.slice(end);
          editor.selectionStart = editor.selectionEnd = start + 4;
        } else {
          var lineStart = value.lastIndexOf('\n', start - 1) + 1;
          var segment = value.slice(lineStart, end);
          var replaced = segment.replace(/^/gm, '    ');
          editor.value = value.slice(0, lineStart) + replaced + value.slice(end);
          editor.selectionStart = lineStart;
          editor.selectionEnd = end + (replaced.length - segment.length);
        }
      } else {
        var unindentStart = value.lastIndexOf('\n', start - 1) + 1;
        var lineEnd = start === end ? (value.indexOf('\n', end) === -1 ? value.length : value.indexOf('\n', end)) : end;
        var block = value.slice(unindentStart, lineEnd);
        var unindented = block.replace(/^ {1,4}/gm, '');
        var removed = block.length - unindented.length;
        editor.value = value.slice(0, unindentStart) + unindented + value.slice(lineEnd);
        editor.selectionStart = Math.max(unindentStart, start - Math.min(4, start - unindentStart));
        editor.selectionEnd = Math.max(editor.selectionStart, end - removed);
      }
      scheduleDraftSave();
      return;
    }

    if (event.key === 'Enter' && !event.shiftKey && !event.ctrlKey && !event.metaKey && !event.altKey) {
      var before = value.slice(0, start);
      var lineStart = before.lastIndexOf('\n') + 1;
      var line = before.slice(lineStart);
      var indentMatch = line.match(/^[ \t]*/);
      var indent = indentMatch ? indentMatch[0] : '';
      var extra = line.trimEnd().endsWith(':') ? '    ' : '';
      if (indent || extra) {
        event.preventDefault();
        var insert = '\n' + indent + extra;
        editor.value = value.slice(0, start) + insert + value.slice(end);
        var cursor = start + insert.length;
        editor.selectionStart = editor.selectionEnd = cursor;
        scheduleDraftSave();
      }
      return;
    }

    if ((event.ctrlKey || event.metaKey) && event.key === 'Enter') {
      event.preventDefault();
      runOnly();
    }
  }

  function goTo(index) {
    if (index < 0 || index >= FLAT_POINTS.length) return;
    if (index === currentIndex) {
      viewMode = 'course';
      renderMain();
      renderSidebar();
      mainEl.scrollTop = 0;
      return;
    }
    viewMode = 'course';
    updateDraftSilently();
    currentIndex = index;
    state.last = FLAT_POINTS[index].point.id;
    persist();
    renderSidebar();
    renderMain();
    mainEl.scrollTop = 0;
  }

  clearBtn.addEventListener('click', function () {
    if (!clearArmed) {
      clearArmed = true;
      clearBtn.textContent = '再点一次确认清空';
      clearBtn.classList.add('armed');
      clearTimer = setTimeout(function () {
        clearArmed = false;
        clearBtn.textContent = '清空进度';
        clearBtn.classList.remove('armed');
      }, 3000);
      return;
    }
    clearTimeout(clearTimer);
    clearArmed = false;
    clearBtn.textContent = '清空进度';
    clearBtn.classList.remove('armed');
    state.completed = {};
    state.drafts = {};
    state.last = null;
    currentIndex = 0;
    persist();
    renderSidebar();
    renderMain();
    showToast('已清空进度和草稿');
  });

  if (exportBtn) {
    exportBtn.addEventListener('click', exportProgress);
  }
  if (importBtn && importFile) {
    importBtn.addEventListener('click', function () { importFile.click(); });
    importFile.addEventListener('change', function () {
      importProgress(importFile.files && importFile.files[0]);
    });
  }

  if (menuBtn) {
    menuBtn.addEventListener('click', function () {
      if (sidebarEl.classList.contains('open')) closeDrawer(true);
      else openDrawer();
    });
  }
  if (drawerClose) {
    drawerClose.addEventListener('click', function () { closeDrawer(true); });
  }
  if (backdrop) {
    backdrop.addEventListener('click', function () { closeDrawer(true); });
  }
  document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape') closeDrawer(true);
  });
  window.addEventListener('resize', function () {
    if (!isMobileLayout()) closeDrawer(false);
  });

  window.addEventListener('beforeunload', function () {
    updateDraftSilently();
    persist();
  });

  renderSidebar();
  renderMain();
</script>
</body>
</html>
