<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f7f9fc">
<meta name="description" content="无需安装、无需注册，打开链接即可学习和练习 Python，学习进度会自动保存在当前浏览器。">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Python 学习区">
<meta property="og:type" content="website">
<meta property="og:title" content="Python 实用学习区">
<meta property="og:description" content="打开链接即可学习 Python，示例、练习和进度保存都在一个页面里。">
<title>Python 实用学习区</title>
<style>
:root {
  --bg: #eef2f8;
  --panel: #ffffff;
  --panel-soft: #f8fafc;
  --border: #e3e9f2;
  --border-strong: #d4deeb;
  --text: #172033;
  --text-2: #3f4c63;
  --muted: #6b7891;
  --faint: #96a1b4;
  --accent: #4f46e5;
  --accent-2: #2563eb;
  --accent-soft: #eef2ff;
  --accent-line: #c7d2fe;
  --ok: #0f9d76;
  --ok-soft: #ecfdf5;
  --ok-line: #a7f3d0;
  --bad: #d92d4b;
  --bad-soft: #fff1f3;
  --bad-line: #fecdd3;
  --warn: #b45309;
  --warn-soft: #fffbeb;
  --warn-line: #fde68a;
  --code-bg: #111a2e;
  --code-top: #16223a;
  --code-text: #dbe4f0;
  --mono: "Cascadia Code", Consolas, "SF Mono", Menlo, monospace;
  --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.03), 0 6px 18px rgba(15, 23, 42, 0.035);
  --shadow-md: 0 18px 45px rgba(30, 41, 59, 0.1);
}

* { box-sizing: border-box; }
html, body { height: 100%; }

body {
  margin: 0;
  overflow: hidden;
  color: var(--text);
  background:
    radial-gradient(900px 520px at 82% -12%, rgba(99, 102, 241, 0.12), transparent 62%),
    radial-gradient(700px 420px at -8% 108%, rgba(37, 99, 235, 0.09), transparent 60%),
    var(--bg);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

::selection { background: rgba(99, 102, 241, 0.18); }

code {
  font-family: var(--mono);
  font-size: 0.9em;
  color: #4338ca;
  background: #f1f5fb;
  border: 1px solid #e4eaf4;
  border-radius: 5px;
  padding: 1px 5px;
}
pre code {
  background: none;
  border: 0;
  border-radius: 0;
  padding: 0;
  font-size: inherit;
  color: inherit;
}

.app {
  display: grid;
  grid-template-columns: 300px minmax(0, 1fr);
  width: 100%;
  max-width: 1500px;
  height: 100vh;
  height: 100dvh;
  margin: 0 auto;
  background: rgba(255, 255, 255, 0.52);
  border-left: 1px solid rgba(255, 255, 255, 0.65);
  border-right: 1px solid rgba(255, 255, 255, 0.65);
  box-shadow: 0 30px 90px rgba(15, 23, 42, 0.08);
}

.mobile-bar { display: none; }
.backdrop { display: none; }
.drawer-close { display: none; }

button {
  touch-action: manipulation;
  -webkit-appearance: none;
  appearance: none;
}

/* ---------- 左侧目录 ---------- */
.sidebar {
  display: flex;
  flex-direction: column;
  min-height: 0;
  background: linear-gradient(180deg, #fbfcff 0%, #f6f8fc 100%);
  border-right: 1px solid var(--border);
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 24px 20px 18px;
  border-bottom: 1px solid rgba(227, 233, 242, 0.85);
}

.brand-mark {
  position: relative;
  width: 42px;
  height: 42px;
  flex: none;
  border-radius: 13px;
  background: linear-gradient(135deg, #4f46e5 0%, #2563eb 58%, #0ea5e9 100%);
  box-shadow: 0 9px 22px rgba(79, 70, 229, 0.28);
  display: grid;
  place-items: center;
}
.brand-mark::after {
  content: "";
  position: absolute;
  inset: 1px;
  border: 1px solid rgba(255, 255, 255, 0.35);
  border-radius: 12px;
}
.brand-mark span {
  position: relative;
  z-index: 1;
  color: #fff;
  font-family: var(--mono);
  font-size: 15px;
  font-weight: 700;
  letter-spacing: -0.03em;
}

.brand-title {
  font-size: 15.5px;
  font-weight: 800;
  letter-spacing: 0.01em;
  color: #1b2436;
}
.brand-sub {
  margin-top: 3px;
  font-size: 11.5px;
  color: var(--faint);
  letter-spacing: 0.03em;
}
.brand-tag {
  margin-left: auto;
  padding: 3px 7px;
  border: 1px solid var(--accent-line);
  border-radius: 99px;
  background: var(--accent-soft);
  color: #4f46e5;
  font-size: 9.5px;
  font-weight: 800;
  letter-spacing: 0.1em;
}

.sidebar-body {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 18px 14px 26px;
  scrollbar-width: thin;
  scrollbar-color: #cbd5e1 transparent;
}
.sidebar-body::-webkit-scrollbar { width: 8px; }
.sidebar-body::-webkit-scrollbar-thumb {
  background: #cbd5e1;
  border: 2px solid transparent;
  background-clip: padding-box;
  border-radius: 99px;
}
.sidebar-body::-webkit-scrollbar-thumb:hover { background: #94a3b8; background-clip: padding-box; }

.chapter { margin-bottom: 20px; }
.chapter-head {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 8px;
  margin-bottom: 8px;
}
.chapter-index {
  display: grid;
  place-items: center;
  width: 22px;
  height: 22px;
  flex: none;
  border: 1px solid var(--border);
  border-radius: 7px;
  background: #eef2f8;
  color: var(--muted);
  font-family: var(--mono);
  font-size: 10.5px;
  font-weight: 700;
}
.chapter.active .chapter-index {
  border-color: transparent;
  background: linear-gradient(135deg, #4f46e5, #2563eb);
  color: #fff;
  box-shadow: 0 4px 10px rgba(79, 70, 229, 0.24);
}
.chapter-name {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 12.5px;
  font-weight: 700;
  letter-spacing: 0.02em;
  color: #45536b;
}
.chapter.active .chapter-name { color: #312e81; }
.chapter-count {
  font-size: 10.5px;
  color: var(--faint);
  font-variant-numeric: tabular-nums;
}
.chapter-bar {
  height: 4px;
  margin: 0 8px 8px 38px;
  border-radius: 99px;
  background: #e8edf5;
  overflow: hidden;
}
.chapter-bar span {
  display: block;
  height: 100%;
  border-radius: 99px;
  background: linear-gradient(90deg, #818cf8, #4f46e5);
  transition: width 0.25s ease;
}

.point-btn {
  position: relative;
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 8px 10px 8px 38px;
  border: 1px solid transparent;
  border-radius: 10px;
  background: transparent;
  color: #465267;
  font-family: inherit;
  font-size: 13px;
  line-height: 1.45;
  text-align: left;
  cursor: pointer;
  transition: background 0.15s ease, color 0.15s ease, box-shadow 0.15s ease;
}
.point-btn:hover { background: #f0f4fc; color: #24304a; }
.point-btn.active {
  background: linear-gradient(90deg, #eef2ff, #f8f9ff);
  border-color: #dde4ff;
  color: #3730a3;
  font-weight: 650;
  box-shadow: 0 2px 8px rgba(79, 70, 229, 0.06);
}
.point-btn.active::before {
  content: "";
  position: absolute;
  left: 0;
  top: 8px;
  bottom: 8px;
  width: 3px;
  border-radius: 0 3px 3px 0;
  background: linear-gradient(180deg, #6366f1, #2563eb);
}
.point-label {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.dot {
  position: relative;
  width: 15px;
  height: 15px;
  flex: none;
  border: 1.5px solid #cbd5e1;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 0 0 3px #f8fafc;
}
.dot.done {
  border-color: transparent;
  background: linear-gradient(135deg, #10b981, #059669);
  box-shadow: 0 0 0 3px #f8fafc, 0 2px 6px rgba(16, 185, 129, 0.3);
}
.dot.done::after {
  content: "";
  position: absolute;
  left: 4.5px;
  top: 1.5px;
  width: 4px;
  height: 7.5px;
  border: solid #fff;
  border-width: 0 1.5px 1.5px 0;
  transform: rotate(45deg);
}

.sidebar-foot {
  padding: 14px 16px 16px;
  border-top: 1px solid var(--border);
  background: linear-gradient(180deg, rgba(251, 252, 255, 0.6), #f6f8fc);
}
.progress-card {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 10px;
  padding: 12px;
  border: 1px solid var(--border);
  border-radius: 14px;
  background: #fff;
  box-shadow: var(--shadow-sm);
}
.progress-ring {
  --p: 0;
  position: relative;
  display: grid;
  place-items: center;
  width: 56px;
  height: 56px;
  flex: none;
  border-radius: 50%;
  background: conic-gradient(var(--accent) calc(var(--p) * 1%), #e6ebf4 0);
  transition: background 0.25s ease;
}
.progress-ring::before {
  content: "";
  position: absolute;
  inset: 5px;
  border-radius: 50%;
  background: #fff;
}
.progress-ring span {
  position: relative;
  z-index: 1;
  color: #1e293b;
  font-size: 11.5px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
}
.progress-meta { flex: 1; min-width: 0; }
.progress-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.1em;
  color: var(--faint);
}
.progress-meta strong {
  display: block;
  margin: 1px 0 6px;
  color: #172033;
  font-size: 16px;
  font-weight: 800;
  letter-spacing: -0.01em;
  font-variant-numeric: tabular-nums;
}
.bar {
  height: 5px;
  border-radius: 99px;
  background: #e8edf5;
  overflow: hidden;
}
.bar span {
  display: block;
  width: 0;
  height: 100%;
  border-radius: 99px;
  background: linear-gradient(90deg, #818cf8, #4f46e5);
  transition: width 0.25s ease;
}
.progress-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 7px;
  margin-bottom: 7px;
}
.progress-action-btn,
.clear-btn {
  width: 100%;
  padding: 8px 10px;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: transparent;
  color: var(--muted);
  font-family: inherit;
  font-size: 12px;
  cursor: pointer;
  transition: border-color 0.15s ease, background 0.15s ease, color 0.15s ease;
}
.progress-action-btn:hover {
  border-color: var(--accent-line);
  background: var(--accent-soft);
  color: #4338ca;
}
.clear-btn:hover {
  border-color: #fecdd3;
  background: #fff1f3;
  color: var(--bad);
}
.clear-btn.armed {
  border-color: var(--bad);
  background: var(--bad);
  color: #fff;
}
.storage-note {
  margin: 8px 2px 0;
  font-size: 11px;
  line-height: 1.55;
  color: var(--warn);
}
.device-note {
  display: flex;
  gap: 7px;
  margin: 9px 2px 0;
  color: #758197;
  font-size: 10.5px;
  line-height: 1.55;
}
.device-note::before {
  content: "";
  width: 5px;
  height: 5px;
  flex: none;
  margin-top: 5px;
  border-radius: 50%;
  background: #10b981;
}
.rule-note {
  display: flex;
  gap: 7px;
  margin: 10px 2px 0;
  font-size: 10.5px;
  line-height: 1.55;
  color: #8a96a9;
}
.rule-dot {
  width: 5px;
  height: 5px;
  flex: none;
  margin-top: 5px;
  border-radius: 50%;
  background: #f59e0b;
}

/* ---------- 右侧内容 ---------- */
.main {
  min-width: 0;
  overflow-y: auto;
  background:
    radial-gradient(620px 300px at 100% 0%, rgba(99, 102, 241, 0.055), transparent 70%),
    #f7f9fc;
  scrollbar-width: thin;
  scrollbar-color: #cbd5e1 transparent;
}
.main::-webkit-scrollbar { width: 10px; }
.main::-webkit-scrollbar-thumb {
  background: #cbd5e1;
  border: 3px solid transparent;
  background-clip: padding-box;
  border-radius: 99px;
}
.main::-webkit-scrollbar-thumb:hover { background: #94a3b8; background-clip: padding-box; }

.main-inner {
  max-width: 900px;
  margin: 0 auto;
  padding: 42px 48px 80px;
}

.page-head {
  position: relative;
  margin-bottom: 26px;
  padding-bottom: 22px;
  border-bottom: 1px solid var(--border);
}
.page-head::after {
  content: "";
  position: absolute;
  left: 0;
  bottom: -1px;
  width: 64px;
  height: 2px;
  border-radius: 99px;
  background: linear-gradient(90deg, #4f46e5, rgba(79, 70, 229, 0));
}
.crumb-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 14px;
}
.crumb {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
  font-size: 12px;
  color: var(--muted);
}
.crumb-chapter { color: #4f46e5; font-weight: 700; }
.crumb .sep { color: #cbd5e1; }
.chip {
  flex: none;
  padding: 4px 10px;
  border: 1px solid #dbe3ff;
  border-radius: 99px;
  background: #eef2ff;
  color: #4338ca;
  font-size: 11px;
  font-weight: 700;
  white-space: nowrap;
}
h1 {
  margin: 0 0 12px;
  color: #111827;
  font-size: 32px;
  line-height: 1.3;
  letter-spacing: -0.03em;
  font-weight: 800;
}
.lede {
  max-width: 780px;
  margin: 0;
  color: var(--text-2);
  font-size: 15.5px;
  line-height: 1.9;
}

.card {
  position: relative;
  margin-bottom: 18px;
  padding: 20px 22px;
  border: 1px solid var(--border);
  border-radius: 16px;
  background: var(--panel);
  box-shadow: var(--shadow-sm);
}
.card-label {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
  color: var(--faint);
  font-size: 10.5px;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}
.card-label::before {
  content: "";
  width: 5px;
  height: 5px;
  flex: none;
  border-radius: 50%;
  background: #c7d2fe;
}
.card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 12px;
}
.card-head .card-label { margin-bottom: 0; }

.analogy-card {
  border-color: #dce6fb;
  background: linear-gradient(135deg, #f7f9ff 0%, #eef4ff 100%);
}
.analogy-card .card-label { color: #6366f1; }
.analogy-card .card-label::before { background: #818cf8; }
.analogy-card p {
  margin: 0;
  color: #35425c;
  font-size: 14.5px;
  line-height: 1.95;
}

.code-card { padding-bottom: 18px; }
.code-shell {
  overflow: hidden;
  border-radius: 12px;
  background: var(--code-bg);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
}
.code-top {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 14px;
  border-bottom: 1px solid rgba(148, 163, 184, 0.12);
  background: rgba(255, 255, 255, 0.025);
}
.code-dots { display: flex; gap: 6px; }
.code-dots i {
  display: block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
}
.code-dots i:nth-child(1) { background: #fb7185; }
.code-dots i:nth-child(2) { background: #fbbf24; }
.code-dots i:nth-child(3) { background: #34d399; }
.code-file {
  color: #8fa0b8;
  font-family: var(--mono);
  font-size: 11px;
}
.code-lang {
  margin-left: auto;
  padding: 2px 8px;
  border: 1px solid rgba(125, 211, 252, 0.22);
  border-radius: 99px;
  color: #7dd3fc;
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 0.08em;
}
pre.code {
  margin: 0;
  padding: 18px 20px;
  overflow-x: auto;
  border: 0;
  border-radius: 0;
  background: transparent;
  color: var(--code-text);
  font-family: var(--mono);
  font-size: 13px;
  line-height: 1.8;
  tab-size: 4;
}
.tok-kw { color: #c4b5fd; }
.tok-str { color: #86efac; }
.tok-num { color: #fbbf24; }
.tok-com { color: #6b7c93; font-style: italic; }
.tok-fn { color: #7dd3fc; }

.warn-card {
  border-color: #f1e4c4;
  background: #fffdf6;
}
.warn-card .card-label { color: #a16207; }
.warn-card .card-label::before { background: #f59e0b; }
.warn-card ul {
  display: grid;
  gap: 8px;
  margin: 0;
  padding: 0;
  list-style: none;
}
.warn-card li {
  position: relative;
  padding-left: 18px;
  color: #5c5547;
  font-size: 13.5px;
  line-height: 1.8;
}
.warn-card li::before {
  content: "";
  position: absolute;
  left: 2px;
  top: 10px;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: #e9c47a;
}

.exercise-card {
  overflow: hidden;
  padding: 0;
  border-color: #dbe3ff;
  box-shadow: 0 18px 44px rgba(79, 70, 229, 0.09);
}
.exercise-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  padding: 20px 22px 0;
}
.exercise-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 8px;
  padding: 4px 9px;
  border-radius: 99px;
  background: var(--accent-soft);
  color: #4338ca;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.12em;
}
.exercise-badge::before {
  content: "";
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: #6366f1;
}
.ex-title {
  margin: 0;
  color: #172033;
  font-size: 20px;
  line-height: 1.4;
  letter-spacing: -0.015em;
}
.mark-btn {
  flex: none;
  padding: 7px 12px;
  border: 1px solid var(--border-strong);
  border-radius: 99px;
  background: #fff;
  color: #64748b;
  font-family: inherit;
  font-size: 11.5px;
  font-weight: 650;
  white-space: nowrap;
  cursor: pointer;
  transition: border-color 0.15s ease, background 0.15s ease, color 0.15s ease;
}
.mark-btn:hover { border-color: #94a3b8; color: #334155; }
.mark-btn.done {
  border-color: var(--ok-line);
  background: var(--ok-soft);
  color: #047857;
  font-weight: 750;
}
.ex-prompt {
  margin: 10px 22px 16px;
  color: #334155;
  font-size: 14px;
  line-height: 1.85;
}
.practice-context {
  display: grid;
  gap: 10px;
  margin: 14px 22px 0;
  padding: 14px;
  border: 1px solid #dce6fb;
  border-radius: 12px;
  background: #f7f9ff;
}
.context-row {
  display: grid;
  grid-template-columns: 68px minmax(0, 1fr);
  gap: 10px;
  align-items: start;
}
.context-label,
.task-label,
.criteria-title {
  color: #4f46e5;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.08em;
}
.context-row p {
  margin: 0;
  color: #4b5870;
  font-size: 12.5px;
  line-height: 1.72;
}
.task-block {
  margin: 14px 22px 16px;
}
.task-label { margin-bottom: 6px; }
.task-block .ex-prompt { margin: 0; }
.criteria-box {
  margin: 0 22px 16px;
  padding: 12px 14px;
  border: 1px solid #e5eaf4;
  border-radius: 12px;
  background: #fbfcfe;
}
.hint-box {
  margin: 0 22px 16px;
  padding: 10px 13px;
  border: 1px solid #f1e4c4;
  border-radius: 10px;
  background: #fffdf6;
}
.hint-box summary {
  color: #9a6700;
  font-size: 11.5px;
  font-weight: 700;
  cursor: pointer;
}
.hint-box p {
  margin: 8px 0 0;
  color: #6b6252;
  font-size: 12px;
  line-height: 1.7;
}
.criteria-title { margin-bottom: 7px; color: #64748b; }
.criteria-list {
  display: grid;
  gap: 5px;
  margin: 0;
  padding: 0;
  list-style: none;
}
.criteria-list li {
  position: relative;
  padding-left: 17px;
  color: #59667a;
  font-size: 12px;
  line-height: 1.6;
}
.criteria-list li::before {
  content: "";
  position: absolute;
  left: 1px;
  top: 7px;
  width: 6px;
  height: 6px;
  border: 1.5px solid #a5b4fc;
  border-radius: 50%;
}

.expected-wrap {
  margin: 0 22px 16px;
  padding: 12px 14px;
  border: 1px solid #d6eee3;
  border-radius: 12px;
  background: linear-gradient(135deg, #f5fdf9 0%, #effaf5 100%);
}
.expected-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 6px;
}
.expected-label {
  color: #0f766e;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.12em;
}
.expected-badge {
  padding: 2px 7px;
  border: 1px solid #bbf7d0;
  border-radius: 99px;
  background: #dcfce7;
  color: #0f766e;
  font-size: 9.5px;
  font-weight: 700;
}
pre.expected {
  margin: 0;
  color: #14532d;
  font-family: var(--mono);
  font-size: 13px;
  line-height: 1.7;
  white-space: pre-wrap;
}
.expected-note {
  margin-top: 7px;
  color: #78998b;
  font-size: 10.5px;
  line-height: 1.6;
}

.editor-shell {
  margin: 0 22px;
  overflow: hidden;
  border: 1px solid #cfd8e3;
  border-radius: 12px;
  background: #fff;
  transition: border-color 0.18s ease, box-shadow 0.18s ease;
}
.editor-shell:focus-within {
  border-color: #6366f1;
  box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.11), 0 8px 22px rgba(79, 70, 229, 0.08);
}
.editor-top {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 8px 13px;
  border-bottom: 1px solid #eef2f7;
  background: #f8fafc;
}
.editor-prompt {
  color: #6366f1;
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 700;
}
.editor-file {
  color: #64748b;
  font-family: var(--mono);
  font-size: 11px;
}
.editor-tip {
  margin-left: auto;
  color: #9aa6b7;
  font-size: 10px;
}
.editor-wrap {
  overflow: hidden;
  border: 0;
  border-radius: 0;
  background: #fff;
}
#editor {
  display: block;
  width: 100%;
  min-height: 180px;
  padding: 16px 18px;
  border: 0;
  outline: none;
  resize: vertical;
  background: #fff;
  color: #0f172a;
  font-family: var(--mono);
  font-size: 13.5px;
  line-height: 1.75;
  tab-size: 4;
  white-space: pre-wrap;
  overflow-wrap: break-word;
}

.toolbar {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 9px;
  padding: 14px 22px 20px;
}
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 9px 16px;
  border: 1px solid var(--border-strong);
  border-radius: 10px;
  background: #fff;
  color: var(--text-2);
  font-family: inherit;
  font-size: 13px;
  font-weight: 650;
  cursor: pointer;
  transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease, border-color 0.15s ease;
}
.btn:hover {
  border-color: #b9c5d6;
  background: #f8fafc;
  transform: translateY(-1px);
  box-shadow: 0 5px 12px rgba(15, 23, 42, 0.06);
}
.btn:active { transform: translateY(0); box-shadow: none; }
.btn-primary {
  border-color: transparent;
  background: linear-gradient(135deg, #4f46e5, #2563eb);
  color: #fff;
  box-shadow: 0 8px 18px rgba(79, 70, 229, 0.24);
}
.btn-primary:hover {
  border-color: transparent;
  background: linear-gradient(135deg, #4338ca, #1d4ed8);
  box-shadow: 0 11px 24px rgba(79, 70, 229, 0.3);
}
.btn-small {
  padding: 5px 10px;
  border-radius: 8px;
  font-size: 11.5px;
}
.btn:disabled { opacity: 0.42; cursor: not-allowed; }
.btn:disabled:hover {
  border-color: var(--border-strong);
  background: #fff;
  transform: none;
  box-shadow: none;
}
.shortcut-hint {
  margin-left: auto;
  color: #9aa6b7;
  font-size: 10.5px;
}

.result {
  margin: 0 22px 20px;
  padding: 15px 17px;
  border: 1px solid;
  border-radius: 12px;
}
.result[hidden] { display: none; }
.result-ok { border-color: var(--ok-line); background: var(--ok-soft); }
.result-bad { border-color: var(--bad-line); background: var(--bad-soft); }
.result-warn { border-color: var(--warn-line); background: var(--warn-soft); }
.result-title {
  display: flex;
  align-items: center;
  gap: 9px;
  margin-bottom: 9px;
  font-size: 13.5px;
  font-weight: 800;
}
.result-title::before {
  display: grid;
  place-items: center;
  width: 20px;
  height: 20px;
  flex: none;
  border-radius: 50%;
  color: #fff;
  font-size: 11px;
  font-weight: 800;
}
.result-ok .result-title { color: #047857; }
.result-ok .result-title::before { content: "✓"; background: #10b981; }
.result-bad .result-title { color: #be123c; }
.result-bad .result-title::before { content: "✕"; background: #e11d48; }
.result-warn .result-title { color: #b45309; }
.result-warn .result-title::before { content: "!"; background: #f59e0b; }
.check-list {
  display: grid;
  gap: 3px;
  margin: 10px 0 8px;
  padding: 0;
  list-style: none;
  font-size: 12.5px;
  line-height: 1.85;
}
.check-list .ok { color: #047857; }
.check-list .bad { color: #be123c; }
.result-explain {
  margin: 6px 0 0;
  color: #526074;
  font-size: 12.5px;
  line-height: 1.85;
}
.result-next { margin-top: 12px; }

.pager {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-top: 30px;
  padding-top: 20px;
  border-top: 1px solid var(--border);
}
.pager .pos {
  color: var(--faint);
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.05em;
  font-variant-numeric: tabular-nums;
}

.toast {
  position: fixed;
  left: 50%;
  bottom: 30px;
  z-index: 50;
  padding: 10px 18px;
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 10px;
  background: rgba(15, 23, 42, 0.94);
  color: #fff;
  font-size: 12.5px;
  box-shadow: 0 14px 34px rgba(15, 23, 42, 0.24);
  opacity: 0;
  pointer-events: none;
  transform: translate(-50%, 10px);
  transition: opacity 0.18s ease, transform 0.18s ease;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

.resume-note {
  display: flex;
  align-items: flex-start;
  gap: 9px;
  margin-bottom: 16px;
  padding: 10px 13px;
  border: 1px solid #d6eee3;
  border-radius: 12px;
  background: #f3fbf7;
  color: #35695b;
  font-size: 11.5px;
  line-height: 1.65;
}
.resume-note::before {
  content: "✓";
  display: grid;
  place-items: center;
  width: 18px;
  height: 18px;
  flex: none;
  margin-top: 1px;
  border-radius: 50%;
  background: #d1fae5;
  color: #047857;
  font-size: 10px;
  font-weight: 800;
}

button:focus-visible {
  outline: 2px solid #818cf8;
  outline-offset: 2px;
}

/* ---------- 新手引导与逐步讲解 ---------- */
.intro-card {
  margin-bottom: 18px;
  padding: 18px 20px;
  border: 1px solid #dbe3ff;
  border-radius: 16px;
  background: linear-gradient(135deg, #f7f8ff 0%, #eef3ff 100%);
  box-shadow: var(--shadow-sm);
}
.intro-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 8px;
}
.intro-kicker {
  display: flex;
  align-items: center;
  gap: 7px;
  color: #4f46e5;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.14em;
}
.intro-kicker::before {
  content: "";
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #6366f1;
}
.intro-count { color: #7c89a0; font-size: 10px; }
.intro-goal {
  margin: 0 0 12px;
  color: #3f4c63;
  font-size: 13.5px;
  line-height: 1.85;
}
.intro-path {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
}
.path-item {
  display: inline-flex;
  align-items: center;
  padding: 4px 9px;
  border: 1px solid #dbe3ff;
  border-radius: 99px;
  background: #fff;
  color: #4f46e5;
  font-size: 10.5px;
  font-weight: 650;
}
.path-item.current {
  border-color: transparent;
  background: linear-gradient(135deg, #4f46e5, #2563eb);
  color: #fff;
  box-shadow: 0 4px 10px rgba(79, 70, 229, 0.2);
}
.path-item.done:not(.current) {
  border-color: #a7f3d0;
  background: #ecfdf5;
  color: #047857;
}
.path-sep { color: #b9c4d6; font-size: 9px; }
.start-tips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px dashed #dbe3ff;
}
.start-tip {
  display: flex;
  align-items: center;
  gap: 6px;
  color: #64748b;
  font-size: 10.5px;
}
.start-tip b {
  display: grid;
  place-items: center;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: #eef2ff;
  color: #4338ca;
  font-family: var(--mono);
  font-size: 9px;
}

.steps-card { border-color: #e3e9f2; }
.step-list {
  display: grid;
  gap: 14px;
  margin: 0;
  padding: 0;
  list-style: none;
}
.step-list li { position: relative; display: flex; gap: 12px; }
.step-list li:not(:last-child)::after {
  content: "";
  position: absolute;
  left: 11.5px;
  top: 27px;
  bottom: -14px;
  width: 1px;
  background: #e4eaf4;
}
.step-number {
  position: relative;
  z-index: 1;
  display: grid;
  place-items: center;
  width: 24px;
  height: 24px;
  flex: none;
  border: 1px solid #dbe3ff;
  border-radius: 50%;
  background: #eef2ff;
  color: #4338ca;
  font-family: var(--mono);
  font-size: 10.5px;
  font-weight: 800;
}
.step-list p {
  margin: 0;
  color: #3f4c63;
  font-size: 13.5px;
  line-height: 1.82;
}
.syntax-box {
  margin-top: 16px;
  overflow: hidden;
  border: 1px solid #e4e9f2;
  border-radius: 12px;
  background: #f8fafc;
}
.syntax-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 8px 12px;
  border-bottom: 1px solid #e9eef6;
}
.syntax-label {
  color: #64748b;
  font-size: 9.5px;
  font-weight: 800;
  letter-spacing: 0.12em;
}
.syntax-tag {
  padding: 2px 7px;
  border: 1px solid #dbe3ff;
  border-radius: 99px;
  background: #eef2ff;
  color: #4f46e5;
  font-size: 9px;
  font-weight: 700;
}
pre.syntax-code {
  margin: 0;
  padding: 12px 14px;
  overflow-x: auto;
  color: #312e81;
  font-family: var(--mono);
  font-size: 12.5px;
  line-height: 1.7;
  white-space: pre;
}

.plan-box {
  margin: 0 22px 16px;
  padding: 12px 14px;
  border: 1px solid #e5eaf4;
  border-radius: 12px;
  background: #f9fbff;
}
.plan-title {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 7px;
  color: #4f46e5;
  font-size: 10.5px;
  font-weight: 800;
  letter-spacing: 0.04em;
}
.plan-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: #6366f1;
}
.plan-list {
  display: grid;
  gap: 4px;
  margin: 0;
  padding-left: 18px;
  color: #5b677c;
  font-size: 12.5px;
  line-height: 1.72;
}
.plan-list li::marker { color: #a5b4fc; font-weight: 700; }

.summary-card {
  border-color: #dbe3ff;
  background: linear-gradient(135deg, #f8f9ff 0%, #f1f5ff 100%);
}
.summary-list {
  display: grid;
  gap: 7px;
  margin: 0;
  padding: 0;
  list-style: none;
}
.summary-list li {
  position: relative;
  padding-left: 20px;
  color: #3f4c63;
  font-size: 13.5px;
  line-height: 1.8;
}
.summary-list li::before {
  content: "✓";
  position: absolute;
  left: 0;
  top: 0;
  color: #4f46e5;
  font-weight: 800;
}
.summary-next {
  margin: 12px 0 0;
  color: #6b7891;
  font-size: 11.5px;
  line-height: 1.7;
}

@media (max-width: 1200px) {
  .app { grid-template-columns: 272px minmax(0, 1fr); }
  .main-inner { padding: 36px 34px 70px; }
}

@media (max-width: 1024px) {
  .app { grid-template-columns: 248px minmax(0, 1fr); }
  .brand { padding: 20px 16px 15px; }
  .brand-tag { display: none; }
  .sidebar-body { padding: 14px 10px 22px; }
  .main-inner { padding: 30px 26px 60px; }
  h1 { font-size: 28px; }
  .exercise-head { padding-left: 18px; padding-right: 18px; }
  .ex-prompt { margin-left: 18px; margin-right: 18px; }
  .expected-wrap, .editor-shell, .result, .plan-box { margin-left: 18px; margin-right: 18px; }
  .intro-card { padding: 16px 18px; }
  .toolbar { padding-left: 18px; padding-right: 18px; }
}

    padding-top: 10px;
    padding-bottom: 10px;
  }

  .backdrop {

  .main {

  .steps-card { padding: 16px; }
  .step-list { gap: 12px; }
  .step-list p { font-size: 13px; line-height: 1.78; }

  .step-list li:not(:last-child)::after { left: 10.5px; top: 25px; bottom: -12px; }

    min-height: 190px;

  }

  .toolbar {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;

            ],
            explain: '75 >= 60 为真，attend 也是真，<code>and</code> 两边都真，整体为真，所以走 <code>if</code> 分支，打印“通过”。'

  function normalizeStoredState(data) {
    return {
      completed: data && data.completed && typeof data.completed === 'object' && !Array.isArray(data.completed) ? data.completed : {},
      drafts: data && data.drafts && typeof data.drafts === 'object' && !Array.isArray(data.drafts) ? data.drafts : {},
      last: data && typeof data.last === 'string' ? data.last : null
    };
  }

  function loadState() {
    var empty = { completed: {}, drafts: {}, last: null };
    try {
      var raw = storageOK ? localStorage.getItem(STORAGE_KEY) : memoryStore[STORAGE_KEY];
      if (!raw) return empty;
      var data = JSON.parse(raw);
      return normalizeStoredState(data);
    } catch (err) {
      return empty;
    }
  }

  function highlightPython(code) {
    var keywords = ['def', 'return', 'if', 'elif', 'else', 'for', 'while', 'in', 'and', 'or', 'not', 'True', 'False', 'None', 'break', 'continue', 'import', 'from', 'as', 'class', 'try', 'except', 'finally', 'with', 'lambda', 'pass', 'global', 'nonlocal', 'is', 'raise', 'yield'];
    var builtins = ['print', 'len', 'range', 'int', 'float', 'str', 'sum', 'max', 'min', 'sorted', 'list', 'dict', 'set', 'tuple', 'type', 'input', 'abs', 'round', 'enumerate', 'zip', 'append', 'strip', 'upper', 'lower', 'split', 'replace', 'join', 'count', 'pop', 'remove', 'insert', 'extend', 'get', 'items', 'keys', 'values'];
    var html = '';
    var i = 0;

    function escapeToken(text) {
      return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    while (i < code.length) {
      var ch = code[i];

      if (ch === '#') {
        var commentEnd = code.indexOf('\n', i);
        if (commentEnd === -1) commentEnd = code.length;
        html += '<span class="tok-com">' + escapeToken(code.slice(i, commentEnd)) + '</span>';
        i = commentEnd;
        continue;
      }

      if (ch === '"' || ch === "'") {
        var quote = ch;
        var end = i + 1;
        if (code.slice(i, i + 3) === quote + quote + quote) {
          end = i + 3;
          while (end < code.length && code.slice(end, end + 3) !== quote + quote + quote) end++;
          end = Math.min(code.length, end + 3);
        } else {
          while (end < code.length) {
            if (code[end] === '\\') { end += 2; continue; }
            if (code[end] === quote) { end++; break; }
            if (code[end] === '\n') break;
            end++;
          }
        }
        html += '<span class="tok-str">' + escapeToken(code.slice(i, end)) + '</span>';
        i = end;
        continue;
      }

      if (/[0-9]/.test(ch)) {
        var numberEnd = i + 1;
        while (numberEnd < code.length && /[0-9._]/.test(code[numberEnd])) numberEnd++;
        html += '<span class="tok-num">' + escapeToken(code.slice(i, numberEnd)) + '</span>';
        i = numberEnd;
        continue;
      }

      if (/[A-Za-z_]/.test(ch)) {
        var wordEnd = i + 1;
        while (wordEnd < code.length && /[A-Za-z0-9_]/.test(code[wordEnd])) wordEnd++;
        var word = code.slice(i, wordEnd);
        var tokenClass = keywords.indexOf(word) !== -1 ? 'tok-kw' : (builtins.indexOf(word) !== -1 ? 'tok-fn' : '');
        html += tokenClass ? '<span class="' + tokenClass + '">' + escapeToken(word) + '</span>' : escapeToken(word);
        i = wordEnd;
        continue;
      }

      html += escapeToken(ch);
      i++;
    }
    return html;
  }

  function showToast(message) {
    var el = document.getElementById('toast');
    el.textContent = message;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 1800);
  }

  function copyText(text, successMessage) {
    function fallbackCopy() {
      var area = document.createElement('textarea');
      area.value = text;
      area.style.position = 'fixed';
      area.style.top = '-1000px';
      area.style.opacity = '0';
      document.body.appendChild(area);
      area.focus();
      area.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (err) { ok = false; }
      document.body.removeChild(area);
      return ok;
    }

    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(function () {
        showToast(successMessage);
      }).catch(function () {
        showToast(fallbackCopy() ? successMessage : '复制失败，请手动选中复制');
      });
    } else {
      showToast(fallbackCopy() ? successMessage : '复制失败，请手动选中复制');
    }
  }

  function exportProgress() {
    updateDraftSilently();
    persist();
    var backup = {
      app: 'python-learning-demo',
      version: 1,
      exportedAt: new Date().toISOString(),
      state: state
    };
    var blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var link = document.createElement('a');
    var date = new Date();
    var month = String(date.getMonth() + 1).padStart(2, '0');
    var day = String(date.getDate()).padStart(2, '0');
    link.href = url;
    link.download = 'python-learning-progress-' + date.getFullYear() + month + day + '.json';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    setTimeout(function () { URL.revokeObjectURL(url); }, 0);
    showToast('进度备份已生成');
  }

  function importProgress(file) {
    if (!file) return;
    if (file.size > 1024 * 1024) {
      showToast('备份文件过大，无法恢复');
      return;
    }
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var parsed = JSON.parse(String(reader.result || ''));
        var incoming = parsed && parsed.state ? parsed.state : parsed;
        if (!incoming || typeof incoming !== 'object' ||
            (!incoming.completed && !incoming.drafts && !incoming.last)) {
          throw new Error('invalid progress file');
        }
        state = normalizeStoredState(incoming);
        currentIndex = state.last && POINT_INDEX.has(state.last) ? POINT_INDEX.get(state.last) : 0;
        persist();
        renderSidebar();
        renderMain();
        mainEl.scrollTop = 0;
        closeDrawer(false);
        showToast('学习进度已恢复');
      } catch (err) {
        showToast('无法识别这个进度备份');
      } finally {
        importFile.value = '';
      }
    };
    reader.onerror = function () {
      importFile.value = '';
      showToast('读取备份失败，请重试');
    };
    reader.readAsText(file);
  }

  function normalizeCode(code) {
    return String(code)
      .replace(/\r\n?/g, '\n')
      .split('\n')
      .map(function (line) { return line.replace(/#.*$/, ''); })
      .join('\n');
  }

  function runCheck() {
    var editor = document.getElementById('editor');
    if (!editor) return;
    var exercise = FLAT_POINTS[currentIndex].point.exercise;
    var clean = normalizeCode(editor.value);
    var box = document.getElementById('result');
    box.hidden = false;

    if (!clean.trim()) {
      box.className = 'result result-warn';
      box.innerHTML = '<div class="result-title">先写点代码再检查</div>' +
        '<p class="result-explain">编辑区现在是空的。照着上面的示例写几行，再点“检查答案”。</p>';
      return;
    }

    var checks = exercise.checks.map(function (check) {
      var ok = false;
      try { ok = !!check.test(clean); } catch (err) { ok = false; }
      return { label: check.label, ok: ok };
    });
    var passed = checks.every(function (check) { return check.ok; });
    var failedCount = checks.filter(function (check) { return !check.ok; }).length;

    if (passed) {
      box.className = 'result result-ok';
      box.innerHTML =
        '<div class="result-title">检查通过，本题已标记完成</div>' +
        '<ul class="check-list">' + checks.map(function (check) {
          return '<li class="ok">✓ ' + escapeHtml(check.label) + '</li>';
        }).join('') + '</ul>' +
        '<p class="result-explain"><strong>为什么这样写：</strong>' + exercise.explain + '</p>' +
        (currentIndex < FLAT_POINTS.length - 1
          ? '<button class="btn result-next" id="nextFromResult" type="button">下一节 →</button>'
          : '<p class="result-explain">所有知识点都学完了，可以回到任意一节复习。</p>');
      var nextFromResult = document.getElementById('nextFromResult');
      if (nextFromResult) {
        nextFromResult.addEventListener('click', function () { goTo(currentIndex + 1); });
      }
      setCompleted(exercise.id, true, { silent: true });
    } else {
      box.className = 'result result-bad';
      box.innerHTML =
        '<div class="result-title">还差 ' + failedCount + ' 项，再改改</div>' +
        '<ul class="check-list">' + checks.map(function (check) {
          return '<li class="' + (check.ok ? 'ok' : 'bad') + '">' + (check.ok ? '✓' : '✗') + ' ' + escapeHtml(check.label) + '</li>';
        }).join('') + '</ul>' +
        '<p class="result-explain">提示：' + exercise.hint + '</p>' +
        '<p class="result-explain">判题只认关键代码特征，不会运行 Python。对照示例和预期输出改，不急着一次写对。</p>';
    }
  }

  function handleEditorKeydown(event) {
    var editor = event.currentTarget;
    var start = editor.selectionStart;
    var end = editor.selectionEnd;
    var value = editor.value;

    if (event.key === 'Tab') {
      event.preventDefault();
      if (!event.shiftKey) {
        if (start === end) {
          editor.value = value.slice(0, start) + '    ' + value.slice(end);
          editor.selectionStart = editor.selectionEnd = start + 4;
        } else {
          var lineStart = value.lastIndexOf('\n', start - 1) + 1;
          var segment = value.slice(lineStart, end);
          var replaced = segment.replace(/^/gm, '    ');
          editor.value = value.slice(0, lineStart) + replaced + value.slice(end);
          editor.selectionStart = lineStart;
          editor.selectionEnd = end + (replaced.length - segment.length);
        }
      } else {
        var unindentStart = value.lastIndexOf('\n', start - 1) + 1;
        var lineEnd = start === end ? (value.indexOf('\n', end) === -1 ? value.length : value.indexOf('\n', end)) : end;
        var block = value.slice(unindentStart, lineEnd);
        var unindented = block.replace(/^ {1,4}/gm, '');
        var removed = block.length - unindented.length;
        editor.value = value.slice(0, unindentStart) + unindented + value.slice(lineEnd);
        editor.selectionStart = Math.max(unindentStart, start - Math.min(4, start - unindentStart));
        editor.selectionEnd = Math.max(editor.selectionStart, end - removed);
      }
      scheduleDraftSave();
      return;
    }

    if (event.key === 'Enter' && !event.shiftKey && !event.ctrlKey && !event.metaKey && !event.altKey) {
      var before = value.slice(0, start);
      var lineStart = before.lastIndexOf('\n') + 1;
      var line = before.slice(lineStart);
      var indentMatch = line.match(/^[ \t]*/);
      var indent = indentMatch ? indentMatch[0] : '';
      var extra = line.trimEnd().endsWith(':') ? '    ' : '';
      if (indent || extra) {
        event.preventDefault();
        var insert = '\n' + indent + extra;
        editor.value = value.slice(0, start) + insert + value.slice(end);
        var cursor = start + insert.length;
        editor.selectionStart = editor.selectionEnd = cursor;
        scheduleDraftSave();
      }
      return;
    }

    if ((event.ctrlKey || event.metaKey) && event.key === 'Enter') {
      event.preventDefault();
      runCheck();
    }
  }

  function goTo(index) {
    if (index < 0 || index >= FLAT_POINTS.length) return;
    if (index === currentIndex) {
      mainEl.scrollTop = 0;
      return;
    }
    updateDraftSilently();
    currentIndex = index;
    state.last = FLAT_POINTS[index].point.id;
    persist();
    renderSidebar();
    renderMain();
    mainEl.scrollTop = 0;
  }

  clearBtn.addEventListener('click', function () {
    if (!clearArmed) {
      clearArmed = true;
      clearBtn.textContent = '再点一次确认清空';
      clearBtn.classList.add('armed');
      clearTimer = setTimeout(function () {
        clearArmed = false;
        clearBtn.textContent = '清空进度';
        clearBtn.classList.remove('armed');
      }, 3000);
      return;
    }
    clearTimeout(clearTimer);
    clearArmed = false;
    clearBtn.textContent = '清空进度';
    clearBtn.classList.remove('armed');
    state.completed = {};
    state.drafts = {};
    state.last = null;
    currentIndex = 0;
    persist();
    renderSidebar();
    renderMain();
    showToast('已清空进度和草稿');
  });

  if (exportBtn) {
    exportBtn.addEventListener('click', exportProgress);
  }
  if (importBtn && importFile) {
    importBtn.addEventListener('click', function () { importFile.click(); });
    importFile.addEventListener('change', function () {
      importProgress(importFile.files && importFile.files[0]);
    });
  }

  if (menuBtn) {
    menuBtn.addEventListener('click', function () {
      if (sidebarEl.classList.contains('open')) closeDrawer(true);
      else openDrawer();
    });
  }
  if (drawerClose) {
    drawerClose.addEventListener('click', function () { closeDrawer(true); });
  }
  if (backdrop) {
    backdrop.addEventListener('click', function () { closeDrawer(true); });
  }
  document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape') closeDrawer(true);
  });
  window.addEventListener('resize', function () {
    if (!isMobileLayout()) closeDrawer(false);
  });

  window.addEventListener('beforeunload', function () {
    updateDraftSilently();
    persist();
  });

  renderSidebar();
  renderMain();
</script>
</body>
</html>
