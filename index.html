<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f7f9fc">
<meta name="description" content="无需安装、无需注册，打开链接即可学习和练习 Python，学习进度会自动保存在当前浏览器。">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Python 学习区">
<meta property="og:type" content="website">
<meta property="og:title" content="Python 实用学习区">
<meta property="og:description" content="打开链接即可学习 Python，示例、练习和进度保存都在一个页面里。">
<title>Python 实用学习区</title>
<style>
:root {
  --bg: #eef2f8;
  --panel: #ffffff;
  --panel-soft: #f8fafc;
  --border: #e3e9f2;
  --border-strong: #d4deeb;
  --text: #172033;
  --text-2: #3f4c63;
  --muted: #6b7891;
  --faint: #96a1b4;
  --accent: #4f46e5;
  --accent-2: #2563eb;
  --accent-soft: #eef2ff;
  --accent-line: #c7d2fe;
  --ok: #0f9d76;
  --ok-soft: #ecfdf5;
  --ok-line: #a7f3d0;
  --bad: #d92d4b;
  --bad-soft: #fff1f3;
  --bad-line: #fecdd3;
  --warn: #b45309;
  --warn-soft: #fffbeb;
  --warn-line: #fde68a;
  --code-bg: #111a2e;
  --code-top: #16223a;
  --code-text: #dbe4f0;
  --mono: "Cascadia Code", Consolas, "SF Mono", Menlo, monospace;
  --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.03), 0 6px 18px rgba(15, 23, 42, 0.035);
  --shadow-md: 0 18px 45px rgba(30, 41, 59, 0.1);
}

* { box-sizing: border-box; }
html, body { height: 100%; }

body {
  margin: 0;
  overflow: hidden;
  color: var(--text);
  background:
    radial-gradient(900px 520px at 82% -12%, rgba(99, 102, 241, 0.12), transparent 62%),
    radial-gradient(700px 420px at -8% 108%, rgba(37, 99, 235, 0.09), transparent 60%),
    var(--bg);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  -webkit-tap-highlight-color: transparent;
}

::selection { background: rgba(99, 102, 241, 0.18); }

code {
  font-family: var(--mono);
  font-size: 0.9em;
  color: #4338ca;
  background: #f1f5fb;
  border: 1px solid #e4eaf4;
  border-radius: 5px;
  padding: 1px 5px;
}
pre code {
  background: none;
  border: 0;
  border-radius: 0;
  padding: 0;
  font-size: inherit;
  color: inherit;
}

.app {
  display: grid;
  grid-template-columns: 300px minmax(0, 1fr);
  width: 100%;
  max-width: 1500px;
  height: 100vh;
  height: 100dvh;
  margin: 0 auto;
  background: rgba(255, 255, 255, 0.52);
  border-left: 1px solid rgba(255, 255, 255, 0.65);
  border-right: 1px solid rgba(255, 255, 255, 0.65);
  box-shadow: 0 30px 90px rgba(15, 23, 42, 0.08);
}

.mobile-bar { display: none; }
.backdrop { display: none; }
.drawer-close { display: none; }

button {
  touch-action: manipulation;
  -webkit-appearance: none;
  appearance: none;
}

/* ---------- 左侧目录 ---------- */
.sidebar {
  display: flex;
  flex-direction: column;
  min-height: 0;
  background: linear-gradient(180deg, #fbfcff 0%, #f6f8fc 100%);
  border-right: 1px solid var(--border);
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 24px 20px 18px;
  border-bottom: 1px solid rgba(227, 233, 242, 0.85);
}

.brand-mark {
  position: relative;
  width: 42px;
  height: 42px;
  flex: none;
  border-radius: 13px;
  background: linear-gradient(135deg, #4f46e5 0%, #2563eb 58%, #0ea5e9 100%);
  box-shadow: 0 9px 22px rgba(79, 70, 229, 0.28);
  display: grid;
  place-items: center;
}
.brand-mark::after {
  content: "";
  position: absolute;
  inset: 1px;
  border: 1px solid rgba(255, 255, 255, 0.35);
  border-radius: 12px;
}
.brand-mark span {
  position: relative;
  z-index: 1;
  color: #fff;
  font-family: var(--mono);
  font-size: 15px;
  font-weight: 700;
  letter-spacing: -0.03em;
}

.brand-title {
  font-size: 15.5px;
  font-weight: 800;
  letter-spacing: 0.01em;
  color: #1b2436;
}
.brand-sub {
  margin-top: 3px;
  font-size: 11.5px;
  color: var(--faint);
  letter-spacing: 0.03em;
}
.brand-tag {
  margin-left: auto;
  padding: 3px 7px;
  border: 1px solid var(--accent-line);
  border-radius: 99px;
  background: var(--accent-soft);
  color: #4f46e5;
  font-size: 9.5px;
  font-weight: 800;
  letter-spacing: 0.1em;
}

.sidebar-body {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 18px 14px 26px;
  scrollbar-width: thin;
  scrollbar-color: #cbd5e1 transparent;
}
.sidebar-body::-webkit-scrollbar { width: 8px; }
.sidebar-body::-webkit-scrollbar-thumb {
  background: #cbd5e1;
  border: 2px solid transparent;
  background-clip: padding-box;
  border-radius: 99px;
}
.sidebar-body::-webkit-scrollbar-thumb:hover { background: #94a3b8; background-clip: padding-box; }

.chapter { margin-bottom: 20px; }
.chapter-head {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 8px;
  margin-bottom: 8px;
}
.chapter-index {
  display: grid;
  place-items: center;
  width: 22px;
  height: 22px;
  flex: none;
  border: 1px solid var(--border);
  border-radius: 7px;
  background: #eef2f8;
  color: var(--muted);
  font-family: var(--mono);
  font-size: 10.5px;
  font-weight: 700;
}
.chapter.active .chapter-index {
  border-color: transparent;
  background: linear-gradient(135deg, #4f46e5, #2563eb);
  color: #fff;
  box-shadow: 0 4px 10px rgba(79, 70, 229, 0.24);
}
.chapter-name {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 12.5px;
  font-weight: 700;
  letter-spacing: 0.02em;
  color: #45536b;
}
.chapter.active .chapter-name { color: #312e81; }
.chapter-count {
  font-size: 10.5px;
  color: var(--faint);
  font-variant-numeric: tabular-nums;
}
.chapter-bar {
  height: 4px;
  margin: 0 8px 8px 38px;
  border-radius: 99px;
  background: #e8edf5;
  overflow: hidden;
}
.chapter-bar span {
  display: block;
  height: 100%;
  border-radius: 99px;
  background: linear-gradient(90deg, #818cf8, #4f46e5);
  transition: width 0.25s ease;
}

.point-btn {
  position: relative;
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 8px 10px 8px 38px;
  border: 1px solid transparent;
  border-radius: 10px;
  background: transparent;
  color: #465267;
  font-family: inherit;
  font-size: 13px;
  line-height: 1.45;
  text-align: left;
  cursor: pointer;
  transition: background 0.15s ease, color 0.15s ease, box-shadow 0.15s ease;
}
.point-btn:hover { background: #f0f4fc; color: #24304a; }
.point-btn.active {
  background: linear-gradient(90deg, #eef2ff, #f8f9ff);
  border-color: #dde4ff;
  color: #3730a3;
  font-weight: 650;
  box-shadow: 0 2px 8px rgba(79, 70, 229, 0.06);
}
.point-btn.active::before {
  content: "";
  position: absolute;
  left: 0;
  top: 8px;
  bottom: 8px;
  width: 3px;
  border-radius: 0 3px 3px 0;
  background: linear-gradient(180deg, #6366f1, #2563eb);
}
.point-label {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.dot {
  position: relative;
  width: 15px;
  height: 15px;
  flex: none;
  border: 1.5px solid #cbd5e1;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 0 0 3px #f8fafc;
}
.dot.done {
  border-color: transparent;
  background: linear-gradient(135deg, #10b981, #059669);
  box-shadow: 0 0 0 3px #f8fafc, 0 2px 6px rgba(16, 185, 129, 0.3);
}
.dot.done::after {
  content: "";
  position: absolute;
  left: 4.5px;
  top: 1.5px;
  width: 4px;
  height: 7.5px;
  border: solid #fff;
  border-width: 0 1.5px 1.5px 0;
  transform: rotate(45deg);
}

.sidebar-foot {
  padding: 14px 16px 16px;
  border-top: 1px solid var(--border);
  background: linear-gradient(180deg, rgba(251, 252, 255, 0.6), #f6f8fc);
}
.progress-card {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 10px;
  padding: 12px;
  border: 1px solid var(--border);
  border-radius: 14px;
  background: #fff;
  box-shadow: var(--shadow-sm);
}
.progress-ring {
  --p: 0;
  position: relative;
  display: grid;
  place-items: center;
  width: 56px;
  height: 56px;
  flex: none;
  border-radius: 50%;
  background: conic-gradient(var(--accent) calc(var(--p) * 1%), #e6ebf4 0);
  transition: background 0.25s ease;
}
.progress-ring::before {
  content: "";
  position: absolute;
  inset: 5px;
  border-radius: 50%;
  background: #fff;
}
.progress-ring span {
  position: relative;
  z-index: 1;
  color: #1e293b;
  font-size: 11.5px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
}
.progress-meta { flex: 1; min-width: 0; }
.progress-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.1em;
  color: var(--faint);
}
.progress-meta strong {
  display: block;
  margin: 1px 0 6px;
  color: #172033;
  font-size: 16px;
  font-weight: 800;
  letter-spacing: -0.01em;
  font-variant-numeric: tabular-nums;
}
.bar {
  height: 5px;
  border-radius: 99px;
  background: #e8edf5;
  overflow: hidden;
}
.bar span {
  display: block;
  width: 0;
  height: 100%;
  border-radius: 99px;
  background: linear-gradient(90deg, #818cf8, #4f46e5);
  transition: width 0.25s ease;
}
.progress-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 7px;
  margin-bottom: 7px;
}
.progress-action-btn,
.clear-btn {
  width: 100%;
  padding: 8px 10px;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: transparent;
  color: var(--muted);
  font-family: inherit;
  font-size: 12px;
  cursor: pointer;
  transition: border-color 0.15s ease, background 0.15s ease, color 0.15s ease;
}
.progress-action-btn:hover {
  border-color: var(--accent-line);
  background: var(--accent-soft);
  color: #4338ca;
}
.clear-btn:hover {
  border-color: #fecdd3;
  background: #fff1f3;
  color: var(--bad);
}
.clear-btn.armed {
  border-color: var(--bad);
  background: var(--bad);
  color: #fff;
}
.storage-note {
  margin: 8px 2px 0;
  font-size: 11px;
  line-height: 1.55;
  color: var(--warn);
}
.device-note {
  display: flex;
  gap: 7px;
  margin: 9px 2px 0;
  color: #758197;
  font-size: 10.5px;
  line-height: 1.55;
}
.device-note::before {
  content: "";
  width: 5px;
  height: 5px;
  flex: none;
  margin-top: 5px;
  border-radius: 50%;
  background: #10b981;
}
.rule-note {
  display: flex;
  gap: 7px;
  margin: 10px 2px 0;
  font-size: 10.5px;
  line-height: 1.55;
  color: #8a96a9;
}
.rule-dot {
  width: 5px;
  height: 5px;
  flex: none;
  margin-top: 5px;
  border-radius: 50%;
  background: #f59e0b;
}

/* ---------- 右侧内容 ---------- */
.main {
  min-width: 0;
  overflow-y: auto;
  background:
    radial-gradient(620px 300px at 100% 0%, rgba(99, 102, 241, 0.055), transparent 70%),
    #f7f9fc;
  scrollbar-width: thin;
  scrollbar-color: #cbd5e1 transparent;
}
.main::-webkit-scrollbar { width: 10px; }
.main::-webkit-scrollbar-thumb {
  background: #cbd5e1;
  border: 3px solid transparent;
  background-clip: padding-box;
  border-radius: 99px;
}
.main::-webkit-scrollbar-thumb:hover { background: #94a3b8; background-clip: padding-box; }

.main-inner {
  max-width: 900px;
  margin: 0 auto;
  padding: 42px 48px 80px;
}

.page-head {
  position: relative;
  margin-bottom: 26px;
  padding-bottom: 22px;
  border-bottom: 1px solid var(--border);
}
.page-head::after {
  content: "";
  position: absolute;
  left: 0;
  bottom: -1px;
  width: 64px;
  height: 2px;
  border-radius: 99px;
  background: linear-gradient(90deg, #4f46e5, rgba(79, 70, 229, 0));
}
.crumb-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 14px;
}
.crumb {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
  font-size: 12px;
  color: var(--muted);
}
.crumb-chapter { color: #4f46e5; font-weight: 700; }
.crumb .sep { color: #cbd5e1; }
.chip {
  flex: none;
  padding: 4px 10px;
  border: 1px solid #dbe3ff;
  border-radius: 99px;
  background: #eef2ff;
  color: #4338ca;
  font-size: 11px;
  font-weight: 700;
  white-space: nowrap;
}
h1 {
  margin: 0 0 12px;
  color: #111827;
  font-size: 32px;
  line-height: 1.3;
  letter-spacing: -0.03em;
  font-weight: 800;
}
.lede {
  max-width: 780px;
  margin: 0;
  color: var(--text-2);
  font-size: 15.5px;
  line-height: 1.9;
}

.card {
  position: relative;
  margin-bottom: 18px;
  padding: 20px 22px;
  border: 1px solid var(--border);
  border-radius: 16px;
  background: var(--panel);
  box-shadow: var(--shadow-sm);
  overflow-wrap: anywhere;
}

/* ---------- 课程层级 ---------- */
.learning-level {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-top: 12px;
  padding: 5px 10px;
  border: 1px solid #dbe3ff;
  border-radius: 99px;
  background: #f5f7ff;
  color: #4f46e5;
  font-size: 10.5px;
  font-weight: 750;
}
.learning-level::before {
  content: "";
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
}
.learning-level.applied {
  border-color: #bae6d4;
  background: #f0fdf7;
  color: #07815f;
}
.learning-level.advanced {
  border-color: #fed7aa;
  background: #fff8ed;
  color: #b45309;
}
.curriculum-map {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
  margin-top: 14px;
}
.curriculum-stage {
  padding: 12px;
  border: 1px solid #e1e7f0;
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.76);
}
.curriculum-stage strong {
  display: block;
  margin-bottom: 4px;
  color: #27344d;
  font-size: 11.5px;
}
.curriculum-stage span {
  display: block;
  color: #748096;
  font-size: 10.5px;
  line-height: 1.6;
}
.card-label {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
  color: var(--faint);
  font-size: 10.5px;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}
.card-label::before {
  content: "";
  width: 5px;
  height: 5px;
  flex: none;
  border-radius: 50%;
  background: #c7d2fe;
}
.card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 12px;
}
.card-head .card-label { margin-bottom: 0; }

.analogy-card {
  border-color: #dce6fb;
  background: linear-gradient(135deg, #f7f9ff 0%, #eef4ff 100%);
}
.analogy-card .card-label { color: #6366f1; }
.analogy-card .card-label::before { background: #818cf8; }
.analogy-card p {
  margin: 0;
  color: #35425c;
  font-size: 14.5px;
  line-height: 1.95;
}

.code-card { padding-bottom: 18px; }
.code-shell {
  overflow: hidden;
  border-radius: 12px;
  background: var(--code-bg);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
}
.code-top {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 14px;
  border-bottom: 1px solid rgba(148, 163, 184, 0.12);
  background: rgba(255, 255, 255, 0.025);
}
.code-dots { display: flex; gap: 6px; }
.code-dots i {
  display: block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
}
.code-dots i:nth-child(1) { background: #fb7185; }
.code-dots i:nth-child(2) { background: #fbbf24; }
.code-dots i:nth-child(3) { background: #34d399; }
.code-file {
  color: #8fa0b8;
  font-family: var(--mono);
  font-size: 11px;
}
.code-lang {
  margin-left: auto;
  padding: 2px 8px;
  border: 1px solid rgba(125, 211, 252, 0.22);
  border-radius: 99px;
  color: #7dd3fc;
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 0.08em;
}
pre.code {
  margin: 0;
  padding: 18px 20px;
  overflow-x: auto;
  border: 0;
  border-radius: 0;
  background: transparent;
  color: var(--code-text);
  font-family: var(--mono);
  font-size: 13px;
  line-height: 1.8;
  tab-size: 4;
}
.tok-kw { color: #c4b5fd; }
.tok-str { color: #86efac; }
.tok-num { color: #fbbf24; }
.tok-com { color: #6b7c93; font-style: italic; }
.tok-fn { color: #7dd3fc; }

.warn-card {
  border-color: #f1e4c4;
  background: #fffdf6;
}
.warn-card .card-label { color: #a16207; }
.warn-card .card-label::before { background: #f59e0b; }
.warn-card ul {
  display: grid;
  gap: 8px;
  margin: 0;
  padding: 0;
  list-style: none;
}
.warn-card li {
  position: relative;
  padding-left: 18px;
  color: #5c5547;
  font-size: 13.5px;
  line-height: 1.8;
}
.warn-card li::before {
  content: "";
  position: absolute;
  left: 2px;
  top: 10px;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: #e9c47a;
}

.exercise-card {
  overflow: hidden;
  padding: 0;
  border-color: #dbe3ff;
  box-shadow: 0 18px 44px rgba(79, 70, 229, 0.09);
}
.exercise-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  padding: 20px 22px 0;
}
.exercise-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 8px;
  padding: 4px 9px;
  border-radius: 99px;
  background: var(--accent-soft);
  color: #4338ca;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.12em;
}
.exercise-badge::before {
  content: "";
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: #6366f1;
}
.ex-title {
  margin: 0;
  color: #172033;
  font-size: 20px;
  line-height: 1.4;
  letter-spacing: -0.015em;
}
.mark-btn {
  flex: none;
  padding: 7px 12px;
  border: 1px solid var(--border-strong);
  border-radius: 99px;
  background: #fff;
  color: #64748b;
  font-family: inherit;
  font-size: 11.5px;
  font-weight: 650;
  white-space: nowrap;
  cursor: pointer;
  transition: border-color 0.15s ease, background 0.15s ease, color 0.15s ease;
}
.mark-btn:hover { border-color: #94a3b8; color: #334155; }
.mark-btn.done {
  border-color: var(--ok-line);
  background: var(--ok-soft);
  color: #047857;
  font-weight: 750;
}
.ex-prompt {
  margin: 10px 22px 16px;
  color: #334155;
  font-size: 14px;
  line-height: 1.85;
}
.practice-context {
  display: grid;
  gap: 10px;
  margin: 14px 22px 0;
  padding: 14px;
  border: 1px solid #dce6fb;
  border-radius: 12px;
  background: #f7f9ff;
}
.context-row {
  display: grid;
  grid-template-columns: 68px minmax(0, 1fr);
  gap: 10px;
  align-items: start;
}
.context-label,
.task-label,
.criteria-title {
  color: #4f46e5;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.08em;
}
.context-row p {
  margin: 0;
  color: #4b5870;
  font-size: 12.5px;
  line-height: 1.72;
}
.task-block {
  margin: 14px 22px 16px;
}
.task-label { margin-bottom: 6px; }
.task-block .ex-prompt { margin: 0; }
.criteria-box {
  margin: 0 22px 16px;
  padding: 12px 14px;
  border: 1px solid #e5eaf4;
  border-radius: 12px;
  background: #fbfcfe;
}
.hint-box {
  margin: 0 22px 16px;
  padding: 10px 13px;
  border: 1px solid #f1e4c4;
  border-radius: 10px;
  background: #fffdf6;
}
.hint-box summary {
  color: #9a6700;
  font-size: 11.5px;
  font-weight: 700;
  cursor: pointer;
}
.hint-box p {
  margin: 8px 0 0;
  color: #6b6252;
  font-size: 12px;
  line-height: 1.7;
}
.criteria-title { margin-bottom: 7px; color: #64748b; }
.criteria-list {
  display: grid;
  gap: 5px;
  margin: 0;
  padding: 0;
  list-style: none;
}
.criteria-list li {
  position: relative;
  padding-left: 17px;
  color: #59667a;
  font-size: 12px;
  line-height: 1.6;
}
.criteria-list li::before {
  content: "";
  position: absolute;
  left: 1px;
  top: 7px;
  width: 6px;
  height: 6px;
  border: 1.5px solid #a5b4fc;
  border-radius: 50%;
}

.expected-wrap {
  margin: 0 22px 16px;
  padding: 12px 14px;
  border: 1px solid #d6eee3;
  border-radius: 12px;
  background: linear-gradient(135deg, #f5fdf9 0%, #effaf5 100%);
}
.expected-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 6px;
}
.expected-label {
  color: #0f766e;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.12em;
}
.expected-badge {
  padding: 2px 7px;
  border: 1px solid #bbf7d0;
  border-radius: 99px;
  background: #dcfce7;
  color: #0f766e;
  font-size: 9.5px;
  font-weight: 700;
}
pre.expected {
  margin: 0;
  color: #14532d;
  font-family: var(--mono);
  font-size: 13px;
  line-height: 1.7;
  white-space: pre-wrap;
}
.expected-note {
  margin-top: 7px;
  color: #78998b;
  font-size: 10.5px;
  line-height: 1.6;
}

.editor-shell {
  margin: 0 22px;
  overflow: hidden;
  border: 1px solid #cfd8e3;
  border-radius: 12px;
  background: #fff;
  transition: border-color 0.18s ease, box-shadow 0.18s ease;
}
.editor-shell:focus-within {
  border-color: #6366f1;
  box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.11), 0 8px 22px rgba(79, 70, 229, 0.08);
}
.editor-top {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 8px 13px;
  border-bottom: 1px solid #eef2f7;
  background: #f8fafc;
}
.editor-prompt {
  color: #6366f1;
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 700;
}
.editor-file {
  color: #64748b;
  font-family: var(--mono);
  font-size: 11px;
}
.editor-tip {
  margin-left: auto;
  color: #9aa6b7;
  font-size: 10px;
}
.editor-wrap {
  overflow: hidden;
  border: 0;
  border-radius: 0;
  background: #fff;
}
#editor {
  display: block;
  width: 100%;
  min-height: 180px;
  padding: 16px 18px;
  border: 0;
  outline: none;
  resize: vertical;
  background: #fff;
  color: #0f172a;
  font-family: var(--mono);
  font-size: 13.5px;
  line-height: 1.75;
  tab-size: 4;
  white-space: pre-wrap;
  overflow-wrap: break-word;
}

.toolbar {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 9px;
  padding: 14px 22px 20px;
}
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 9px 16px;
  border: 1px solid var(--border-strong);
  border-radius: 10px;
  background: #fff;
  color: var(--text-2);
  font-family: inherit;
  font-size: 13px;
  font-weight: 650;
  cursor: pointer;
  transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease, border-color 0.15s ease;
}
.btn:hover {
  border-color: #b9c5d6;
  background: #f8fafc;
  transform: translateY(-1px);
  box-shadow: 0 5px 12px rgba(15, 23, 42, 0.06);
}
.btn:active { transform: translateY(0); box-shadow: none; }
.btn-primary {
  border-color: transparent;
  background: linear-gradient(135deg, #4f46e5, #2563eb);
  color: #fff;
  box-shadow: 0 8px 18px rgba(79, 70, 229, 0.24);
}
.btn-primary:hover {
  border-color: transparent;
  background: linear-gradient(135deg, #4338ca, #1d4ed8);
  box-shadow: 0 11px 24px rgba(79, 70, 229, 0.3);
}
.btn-small {
  padding: 5px 10px;
  border-radius: 8px;
  font-size: 11.5px;
}
.btn:disabled { opacity: 0.42; cursor: not-allowed; }
.btn:disabled:hover {
  border-color: var(--border-strong);
  background: #fff;
  transform: none;
  box-shadow: none;
}
.shortcut-hint {
  margin-left: auto;
  color: #9aa6b7;
  font-size: 10.5px;
}

.btn-run {
  border-color: #99f6e4;
  background: #f0fdfa;
  color: #0f766e;
}
.runtime-panel {
  margin: 0 22px 14px;
  overflow: hidden;
  border: 1px solid #334155;
  border-radius: 12px;
  background: #0f172a;
}
.runtime-panel[hidden] { display: none; }
.runtime-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 9px 13px;
  border-bottom: 1px solid #334155;
  color: #94a3b8;
  font-size: 10.5px;
}
.runtime-status { color: #5eead4; font-weight: 750; }
.runtime-output {
  min-height: 62px;
  max-height: 260px;
  margin: 0;
  padding: 13px;
  overflow: auto;
  color: #e2e8f0;
  font: 12.5px/1.7 var(--mono);
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  -webkit-overflow-scrolling: touch;
}
.runtime-output.error { color: #fda4af; }
.runtime-help {
  padding: 0 13px 12px;
  color: #fda4af;
  font-size: 11.5px;
  line-height: 1.7;
}

.result {
  margin: 0 22px 20px;
  padding: 15px 17px;
  border: 1px solid;
  border-radius: 12px;
}
.result[hidden] { display: none; }
.result-ok { border-color: var(--ok-line); background: var(--ok-soft); }
.result-bad { border-color: var(--bad-line); background: var(--bad-soft); }
.result-warn { border-color: var(--warn-line); background: var(--warn-soft); }
.result-title {
  display: flex;
  align-items: center;
  gap: 9px;
  margin-bottom: 9px;
  font-size: 13.5px;
  font-weight: 800;
}
.result-title::before {
  display: grid;
  place-items: center;
  width: 20px;
  height: 20px;
  flex: none;
  border-radius: 50%;
  color: #fff;
  font-size: 11px;
  font-weight: 800;
}
.result-ok .result-title { color: #047857; }
.result-ok .result-title::before { content: "✓"; background: #10b981; }
.result-bad .result-title { color: #be123c; }
.result-bad .result-title::before { content: "✕"; background: #e11d48; }
.result-warn .result-title { color: #b45309; }
.result-warn .result-title::before { content: "!"; background: #f59e0b; }
.check-list {
  display: grid;
  gap: 3px;
  margin: 10px 0 8px;
  padding: 0;
  list-style: none;
  font-size: 12.5px;
  line-height: 1.85;
}
.check-list .ok { color: #047857; }
.check-list .bad { color: #be123c; }
.result-explain {
  margin: 6px 0 0;
  color: #526074;
  font-size: 12.5px;
  line-height: 1.85;
}
.result-next { margin-top: 12px; }

.pager {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-top: 30px;
  padding-top: 20px;
  border-top: 1px solid var(--border);
}
.pager .pos {
  color: var(--faint);
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.05em;
  font-variant-numeric: tabular-nums;
}

.toast {
  position: fixed;
  left: 50%;
  bottom: 30px;
  z-index: 50;
  padding: 10px 18px;
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 10px;
  background: rgba(15, 23, 42, 0.94);
  color: #fff;
  font-size: 12.5px;
  box-shadow: 0 14px 34px rgba(15, 23, 42, 0.24);
  opacity: 0;
  pointer-events: none;
  transform: translate(-50%, 10px);
  transition: opacity 0.18s ease, transform 0.18s ease;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

.resume-note {
  display: flex;
  align-items: flex-start;
  gap: 9px;
  margin-bottom: 16px;
  padding: 10px 13px;
  border: 1px solid #d6eee3;
  border-radius: 12px;
  background: #f3fbf7;
  color: #35695b;
  font-size: 11.5px;
  line-height: 1.65;
}
.resume-note::before {
  content: "✓";
  display: grid;
  place-items: center;
  width: 18px;
  height: 18px;
  flex: none;
  margin-top: 1px;
  border-radius: 50%;
  background: #d1fae5;
  color: #047857;
  font-size: 10px;
  font-weight: 800;
}

button:focus-visible {
  outline: 2px solid #818cf8;
  outline-offset: 2px;
}

/* ---------- 新手引导与逐步讲解 ---------- */
.intro-card {
  margin-bottom: 18px;
  padding: 18px 20px;
  border: 1px solid #dbe3ff;
  border-radius: 16px;
  background: linear-gradient(135deg, #f7f8ff 0%, #eef3ff 100%);
  box-shadow: var(--shadow-sm);
}
.intro-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 8px;
}
.intro-kicker {
  display: flex;
  align-items: center;
  gap: 7px;
  color: #4f46e5;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.14em;
}
.intro-kicker::before {
  content: "";
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #6366f1;
}
.intro-count { color: #7c89a0; font-size: 10px; }
.intro-goal {
  margin: 0 0 12px;
  color: #3f4c63;
  font-size: 13.5px;
  line-height: 1.85;
}

.chapter-showcase {
  margin-top: 20px;
  padding: 20px;
  border: 1px solid #c7d2fe;
  border-radius: 18px;
  background: linear-gradient(145deg, #eef2ff 0%, #ffffff 58%, #ecfeff 100%);
  box-shadow: 0 14px 30px rgba(49, 46, 129, .08);
}

.showcase-copy h3 {
  margin: 6px 0 8px;
  color: #1e1b4b;
  font-size: 1.08rem;
}

.showcase-copy p,
.showcase-takeaway { line-height: 1.75; }

.showcase-kicker {
  color: #4338ca;
  font-size: .78rem;
  font-weight: 800;
  letter-spacing: .08em;
}

.showcase-code {
  margin-top: 14px;
  overflow-x: auto;
  border-radius: 13px;
  background: #111827;
  color: #e5e7eb;
  -webkit-overflow-scrolling: touch;
}

.showcase-code pre,
.showcase-result pre {
  margin: 0;
  padding: 15px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  font: 13px/1.7 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

.showcase-result {
  margin-top: 10px;
  border: 1px solid #bae6fd;
  border-radius: 12px;
  background: rgba(255,255,255,.82);
}

.showcase-result > span {
  display: block;
  padding: 9px 14px 0;
  color: #0369a1;
  font-size: .76rem;
  font-weight: 800;
}

.showcase-result pre { padding-top: 7px; color: #0f172a; }

.showcase-takeaway {
  margin-top: 12px;
  padding: 11px 13px;
  border-left: 4px solid #14b8a6;
  border-radius: 8px;
  background: rgba(240, 253, 250, .9);
  color: #134e4a;
  font-size: .9rem;
}

@media (max-width: 480px) {
  .chapter-showcase { padding: 15px; border-radius: 15px; }
  .showcase-code pre, .showcase-result pre { padding: 12px; font-size: 12px; }
  .showcase-result > span { padding-left: 12px; }
}
.intro-path {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
}
.path-item {
  display: inline-flex;
  align-items: center;
  padding: 4px 9px;
  border: 1px solid #dbe3ff;
  border-radius: 99px;
  background: #fff;
  color: #4f46e5;
  font-size: 10.5px;
  font-weight: 650;
}
.path-item.current {
  border-color: transparent;
  background: linear-gradient(135deg, #4f46e5, #2563eb);
  color: #fff;
  box-shadow: 0 4px 10px rgba(79, 70, 229, 0.2);
}
.path-item.done:not(.current) {
  border-color: #a7f3d0;
  background: #ecfdf5;
  color: #047857;
}
.path-sep { color: #b9c4d6; font-size: 9px; }
.start-tips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px dashed #dbe3ff;
}
.start-tip {
  display: flex;
  align-items: center;
  gap: 6px;
  color: #64748b;
  font-size: 10.5px;
}
.start-tip b {
  display: grid;
  place-items: center;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: #eef2ff;
  color: #4338ca;
  font-family: var(--mono);
  font-size: 9px;
}

.steps-card { border-color: #e3e9f2; }
.deep-dive-card {
  border-color: #bfdbfe;
  background: #f8fbff;
}
.concept-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
  margin-bottom: 15px;
}
.concept-item {
  padding: 12px 13px;
  border: 1px solid #dbeafe;
  border-radius: 10px;
  background: #fff;
}
.concept-item strong {
  display: block;
  margin-bottom: 5px;
  color: #1d4ed8;
  font-size: 11.5px;
}
.concept-item p {
  margin: 0;
  color: #475569;
  font-size: 12.5px;
  line-height: 1.75;
}
.trace-title {
  margin: 5px 0 9px;
  color: #334155;
  font-size: 12px;
  font-weight: 800;
}
.trace-table-wrap {
  overflow-x: auto;
  border: 1px solid #dbe3ef;
  border-radius: 10px;
  background: #fff;
  -webkit-overflow-scrolling: touch;
}
.trace-table {
  width: 100%;
  min-width: 530px;
  border-collapse: collapse;
  font-size: 11.5px;
}
.trace-table th,
.trace-table td {
  padding: 9px 10px;
  border-bottom: 1px solid #edf2f7;
  text-align: left;
  line-height: 1.55;
  vertical-align: top;
}
.trace-table th { background: #eff6ff; color: #1e40af; }
.trace-table tr:last-child td { border-bottom: 0; }
.deep-note {
  margin-top: 13px;
  padding: 11px 12px;
  border-left: 4px solid #0ea5e9;
  border-radius: 7px;
  background: #f0f9ff;
  color: #0c4a6e;
  font-size: 12px;
  line-height: 1.75;
}
.step-list {
  display: grid;
  gap: 14px;
  margin: 0;
  padding: 0;
  list-style: none;
}
.step-list li { position: relative; display: flex; gap: 12px; }
.step-list li:not(:last-child)::after {
  content: "";
  position: absolute;
  left: 11.5px;
  top: 27px;
  bottom: -14px;
  width: 1px;
  background: #e4eaf4;
}
.step-number {
  position: relative;
  z-index: 1;
  display: grid;
  place-items: center;
  width: 24px;
  height: 24px;
  flex: none;
  border: 1px solid #dbe3ff;
  border-radius: 50%;
  background: #eef2ff;
  color: #4338ca;
  font-family: var(--mono);
  font-size: 10.5px;
  font-weight: 800;
}
.step-list p {
  margin: 0;
  color: #3f4c63;
  font-size: 13.5px;
  line-height: 1.82;
}
.syntax-box {
  margin-top: 16px;
  overflow: hidden;
  border: 1px solid #e4e9f2;
  border-radius: 12px;
  background: #f8fafc;
}
.syntax-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 8px 12px;
  border-bottom: 1px solid #e9eef6;
}
.syntax-label {
  color: #64748b;
  font-size: 9.5px;
  font-weight: 800;
  letter-spacing: 0.12em;
}
.syntax-tag {
  padding: 2px 7px;
  border: 1px solid #dbe3ff;
  border-radius: 99px;
  background: #eef2ff;
  color: #4f46e5;
  font-size: 9px;
  font-weight: 700;
}
pre.syntax-code {
  margin: 0;
  padding: 12px 14px;
  overflow-x: auto;
  color: #312e81;
  font-family: var(--mono);
  font-size: 12.5px;
  line-height: 1.7;
  white-space: pre;
}

.plan-box {
  margin: 0 22px 16px;
  padding: 12px 14px;
  border: 1px solid #e5eaf4;
  border-radius: 12px;
  background: #f9fbff;
}
.plan-title {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 7px;
  color: #4f46e5;
  font-size: 10.5px;
  font-weight: 800;
  letter-spacing: 0.04em;
}
.plan-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: #6366f1;
}
.plan-list {
  display: grid;
  gap: 4px;
  margin: 0;
  padding-left: 18px;
  color: #5b677c;
  font-size: 12.5px;
  line-height: 1.72;
}
.plan-list li::marker { color: #a5b4fc; font-weight: 700; }

.summary-card {
  border-color: #dbe3ff;
  background: linear-gradient(135deg, #f8f9ff 0%, #f1f5ff 100%);
}
.summary-list {
  display: grid;
  gap: 7px;
  margin: 0;
  padding: 0;
  list-style: none;
}
.summary-list li {
  position: relative;
  padding-left: 20px;
  color: #3f4c63;
  font-size: 13.5px;
  line-height: 1.8;
}
.summary-list li::before {
  content: "✓";
  position: absolute;
  left: 0;
  top: 0;
  color: #4f46e5;
  font-weight: 800;
}
.summary-next {
  margin: 12px 0 0;
  color: #6b7891;
  font-size: 11.5px;
  line-height: 1.7;
}

@media (max-width: 1200px) {
  .app { grid-template-columns: 272px minmax(0, 1fr); }
  .main-inner { padding: 36px 34px 70px; }
}

@media (max-width: 1024px) {
  .app { grid-template-columns: 248px minmax(0, 1fr); }

  .brand-tag { display: none; }
  .sidebar-body { padding: 14px 10px 22px; }
  .main-inner { padding: 30px 26px 60px; }

  .exercise-head { padding-left: 18px; padding-right: 18px; }
  .ex-prompt { margin-left: 18px; margin-right: 18px; }
  .expected-wrap, .editor-shell, .result, .plan-box { margin-left: 18px; margin-right: 18px; }
  .runtime-panel { margin-left: 18px; margin-right: 18px; }
  .intro-card { padding: 16px 18px; }
  .toolbar { padding-left: 18px; padding-right: 18px; }

    display: flex;
    flex-direction: column;

    background: rgba(255, 255, 255, 0.97);
    box-shadow: 0 4px 16px rgba(15, 23, 42, 0.05);
  }

<script>
  function re(pattern) {
    return function (code) { return pattern.test(code); };
  }

  const COURSE = [
    {
      title: '变量与类型',
      points: [
        {
          id: 'p1-1',
          title: '变量与赋值',
          oneLine: '变量是一个名字，用 <code>=</code> 把数据存进去，之后用这个名字就能把数据取出来。',
          analogy: '像给储物箱贴标签：标签写 city，箱子里放“上海”。以后要找“上海”，直接喊 city 就行。换掉箱子里的东西，标签不用改。',
          example: `name = "小明"      # 把字符串 "小明" 存进 name
age = 18           # 把整数 18 存进 age

print(name)        # 小明
print(age)         # 18

age = 19           # 同一个变量可以重新赋值
print(age)         # 19`,
          mistakes: [
            '<code>=</code> 是赋值，不是“等于”。判断相等要用 <code>==</code>。',
            '变量名不能以数字开头，也不能用 <code>if</code>、<code>for</code> 这类关键字。',
            '变量要先赋值再使用，否则会报 <code>NameError</code>。'
          ],
          exercise: {
            id: 'ex1-1',
            title: '存两个变量并打印',
            prompt: '创建变量 <code>city</code> 存字符串 <code>"上海"</code>，创建变量 <code>years</code> 存整数 <code>3</code>。然后分别打印 <code>city</code> 和 <code>years</code>。',
            hint: '变量名直接写，不用加引号；打印变量时也不要把变量名放进引号里。',
            starter: '# 在这里写代码\n# 提示：变量名 = 值\n',
            expected: '上海\n3',
            checks: [
              { label: '创建变量 city 并赋值为 "上海"', test: re(/city\s*=\s*["']上海["']/) },
              { label: '创建变量 years 并赋值为 3', test: re(/years\s*=\s*3(?![\d.])/) },
              { label: '打印变量 city', test: re(/print\s*\(\s*city\s*\)/) },
              { label: '打印变量 years', test: re(/print\s*\(\s*years\s*\)/) }
            ],
            explain: '<code>city = "上海"</code> 把字符串存进 city；<code>print(city)</code> 不加引号，打印的是变量里的内容。写成 <code>print("city")</code> 的话，屏幕上只会出现单词 city。'
          }
        },
        {
          id: 'p1-2',
          title: '数字与字符串',
          oneLine: '数字直接写，字符串要加引号；加了引号就是文字，不再参与数学计算。',
          analogy: '数字像秤上的读数，能加减；字符串像纸条上写的“10”，只是两个字符，不能当钱花。',
          example: `a = 10
b = "10"

print(a + 5)     # 15，数字相加
print(b + "5")   # 105，字符串拼接
print(a == b)    # False，一个是数字，一个是文字`,
          mistakes: [
            '<code>"10" + 5</code> 会报 <code>TypeError</code>，字符串和数字不能直接相加。',
            '<code>"10"</code> 和 <code>10</code> 不相等，比较时类型也要一致。',
            '中文引号“”不是 Python 的字符串引号，要敲英文的 <code>""</code>。'
          ],
          exercise: {
            id: 'ex1-2',
            title: '把数字和文字拼起来',
            prompt: '已有 <code>price = 12</code> 和 <code>label = "元"</code>。请让程序输出 <code>价格：12元</code>（12 和“元”之间没有空格）。要求用 <code>str(price)</code> 把数字转成字符串再拼接。',
            hint: '拼接顺序可以是 "价格：" + str(price) + label，加号两边都必须是字符串。',
            starter: 'price = 12\nlabel = "元"\n\n# 在这里写 print，把 "价格："、str(price)、label 拼起来\n',
            expected: '价格：12元',
            checks: [
              { label: 'price 仍然是 12', test: re(/price\s*=\s*12(?![\d.])/) },
              { label: '用 str(price) 把数字转成字符串', test: re(/str\s*\(\s*price\s*\)/) },
              { label: 'print 里包含文字“价格：”', test: re(/print\s*\([^\n]*价格/) },
              { label: 'print 里包含变量 label', test: re(/print\s*\([^\n]*label/) }
            ],
            explain: '<code>str(price)</code> 把数字 12 变成文字 "12"，这样才能和 <code>"价格："</code>、<code>label</code> 用 <code>+</code> 拼在一起。直接写 <code>print(price, label)</code> 会在中间多出一个空格。'
          }
        },
        {
          id: 'p1-3',
          title: '类型转换',
          oneLine: '用 <code>int()</code>、<code>float()</code>、<code>str()</code> 把值换成另一种类型再使用。',
          analogy: '像把散装米装进标准袋：米没变，只是换了个能上货架的包装。',
          example: `text = "25"
number = int(text)

print(number + 5)      # 30
print(text + "5")      # 255
print(float("3.5"))    # 3.5`,
          mistakes: [
            '<code>int("25.5")</code> 会报错，得先 <code>float("25.5")</code> 再 <code>int()</code>。',
            '<code>int()</code> 直接截掉小数部分，不是四舍五入：<code>int(3.9)</code> 得到 <code>3</code>。',
            '转换失败会报 <code>ValueError</code>，比如 <code>int("abc")</code>。'
          ],
          exercise: {
            id: 'ex1-3',
            title: '先转浮点，再转整数',
            prompt: '把字符串 <code>"3.5"</code> 转成浮点数存进 <code>x</code>，再把 <code>x</code> 转成整数存进 <code>y</code>。最后打印 <code>x</code> 和 <code>y</code>。',
            hint: '先写 x = float("3.5")，再写 y = int(x)；打印时直接写变量名。',
            starter: '# 先转 float，再转 int\n\n',
            expected: '3.5\n3',
            checks: [
              { label: '把 "3.5" 转成浮点数存进 x', test: re(/x\s*=\s*float\s*\(\s*["']3\.5["']\s*\)/) },
              { label: '把 x 转成整数存进 y', test: re(/y\s*=\s*int\s*\(\s*x\s*\)/) },
              { label: '打印 x', test: re(/print\s*\(\s*x\s*\)/) },
              { label: '打印 y', test: re(/print\s*\(\s*y\s*\)/) }
            ],
            explain: '<code>float("3.5")</code> 得到 3.5；<code>int(x)</code> 把 3.5 截成 3。打印结果分别是 3.5 和 3。'
          }
        }
      ]
    },
    {
      title: '条件判断',
      points: [
        {
          id: 'p2-1',
          title: 'if / elif / else',
          oneLine: '条件为真就走 <code>if</code> 里的代码；不真就看 <code>elif</code>；都不满足走 <code>else</code>。',
          analogy: '出门前看天：下雨带伞，太阳大戴帽子，既不下雨也不晒就空手走。每次只走一条路。',
          example: `score = 85

if score >= 90:
    print("优秀")
elif score >= 60:
    print("及格")
else:
    print("不及格")

# 运行结果：及格`,
          mistakes: [
            '<code>if</code> 条件后面漏了英文冒号 <code>:</code>。',
            '缩进不一致。同一个分支下面统一用 4 个空格。',
            '<code>elif</code> 可以有很多个，<code>else</code> 最多一个，而且放在最后。'
          ],
          exercise: {
            id: 'ex2-1',
            title: '温度判断',
            prompt: '变量 <code>temp = 30</code>。如果 <code>temp</code> 大于 28，打印 <code>开空调</code>；否则打印 <code>不开空调</code>。',
            hint: 'if 行末尾要有英文冒号，分支里的 print 要缩进 4 个空格。',
            starter: 'temp = 30\n\n# 用 if / else 判断，注意缩进 4 个空格\n',
            expected: '开空调',
            checks: [
              { label: 'temp 赋值为 30', test: re(/temp\s*=\s*30(?![\d.])/) },
              { label: '用 if 判断 temp > 28', test: re(/if\s+temp\s*>\s*28\s*:/) },
              { label: 'if 分支里打印“开空调”', test: re(/if\s+temp\s*>\s*28\s*:[^\n]*\n[ \t]+print\s*\(\s*["']开空调["']\s*\)/) },
              { label: '有 else 分支', test: re(/else\s*:/) },
              { label: 'else 分支里打印“不开空调”', test: re(/else\s*:[^\n]*\n[ \t]+print\s*\(\s*["']不开空调["']\s*\)/) }
            ],
            explain: '30 大于 28，条件成立，所以走 <code>if</code> 分支，只打印“开空调”；<code>else</code> 里的内容这一轮不会执行。'
          }
        },
        {
          id: 'p2-2',
          title: '比较与逻辑运算符',
          oneLine: '<code>==</code> 判断相等，<code>!=</code> 判断不等；<code>and</code> 要求两边都真，<code>or</code> 只要一边真，<code>not</code> 把真假反过来。',
          analogy: '<code>and</code> 像两道门都要刷卡才进得去；<code>or</code> 像任意一道门刷卡就行。',
          example: `age = 20
has_ticket = True

print(age >= 18)                 # True
print(age >= 18 and has_ticket)  # True
print(age < 18 or has_ticket)    # True
print(not has_ticket)            # False`,
          mistakes: [
            '把 <code>==</code> 写成 <code>=</code>，会变成赋值。',
            '<code>"20" == 20</code> 是 <code>False</code>，类型不同。',
            '<code>and</code> 和 <code>or</code> 混用时加括号，别靠猜优先级。'
          ],
          exercise: {

  const STORAGE_KEY = 'python-learning-demo-v1';
  const FLAT_POINTS = [];
  const POINT_INDEX = new Map();
  COURSE.forEach(function (chapter) {
    chapter.points.forEach(function (point) {
      POINT_INDEX.set(point.id, FLAT_POINTS.length);
      FLAT_POINTS.push({ chapter: chapter, point: point });
    });
  });
  const ALL_EXERCISES = FLAT_POINTS.map(function (item) { return item.point.exercise; });

  var storageOK = true;
  try {
    var probeKey = '__py_demo_probe__';
    localStorage.setItem(probeKey, '1');
    localStorage.removeItem(probeKey);
  } catch (err) {
    storageOK = false;
  }

  var memoryStore = {};

  function normalizeStoredState(data) {
    return {
      completed: data && data.completed && typeof data.completed === 'object' && !Array.isArray(data.completed) ? data.completed : {},
      drafts: data && data.drafts && typeof data.drafts === 'object' && !Array.isArray(data.drafts) ? data.drafts : {},
      last: data && typeof data.last === 'string' ? data.last : null
    };
  }

  function loadState() {
    var empty = { completed: {}, drafts: {}, last: null };
    try {
      var raw = storageOK ? localStorage.getItem(STORAGE_KEY) : memoryStore[STORAGE_KEY];
      if (!raw) return empty;
      var data = JSON.parse(raw);
      return normalizeStoredState(data);
    } catch (err) {
      return empty;
    }
  }

  var state = loadState();

  function persist() {
    var payload = JSON.stringify(state);
    try {
      if (storageOK) localStorage.setItem(STORAGE_KEY, payload);
      else memoryStore[STORAGE_KEY] = payload;
    } catch (err) {
      storageOK = false;
      memoryStore[STORAGE_KEY] = payload;
      var note = document.getElementById('storageNote');
      if (note) note.hidden = false;
    }
  }

  var mainEl = document.getElementById('main');
  var mainInner = document.getElementById('mainInner');
  var sidebarBody = document.getElementById('sidebarBody');
  var totalText = document.getElementById('totalText');
  var totalBar = document.getElementById('totalBar');
  var storageNote = document.getElementById('storageNote');
  var clearBtn = document.getElementById('clearBtn');
  var exportBtn = document.getElementById('exportBtn');
  var importBtn = document.getElementById('importBtn');
  var importFile = document.getElementById('importFile');
  var sidebarEl = document.getElementById('sidebar');
  var menuBtn = document.getElementById('menuBtn');
  var drawerClose = document.getElementById('drawerClose');
  var backdrop = document.getElementById('backdrop');
  var mobileProgress = document.getElementById('mobileProgress');

  var currentIndex = 0;
  if (state.last && POINT_INDEX.has(state.last)) {
    currentIndex = POINT_INDEX.get(state.last);

  var saveTimer = null;

  function isMobileLayout() {
    return window.matchMedia('(max-width: 960px)').matches;
  }

  function openDrawer() {
    if (!isMobileLayout() || !sidebarEl) return;
    sidebarEl.classList.add('open');
    if (backdrop) {
      backdrop.classList.add('show');
      backdrop.setAttribute('aria-hidden', 'false');

      try { drawerClose.focus({ preventScroll: true }); } catch (err) { drawerClose.focus(); }
    }
  }

  function closeDrawer(returnFocus) {
    if (!sidebarEl) return;
    var wasOpen = sidebarEl.classList.contains('open');
    sidebarEl.classList.remove('open');
    if (backdrop) {
      backdrop.classList.remove('show');
      backdrop.setAttribute('aria-hidden', 'true');
    }
    document.body.classList.remove('drawer-open');
    if (menuBtn) {
      menuBtn.setAttribute('aria-expanded', 'false');
      menuBtn.setAttribute('aria-label', '打开章节目录');
    }
    if (returnFocus && wasOpen && isMobileLayout() && menuBtn) {
      try { menuBtn.focus({ preventScroll: true }); } catch (err) { menuBtn.focus(); }
    }
  }

  function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
    });
  }

  function highlightPython(code) {
    var keywords = ['def', 'return', 'if', 'elif', 'else', 'for', 'while', 'in', 'and', 'or', 'not', 'True', 'False', 'None', 'break', 'continue', 'import', 'from', 'as', 'class', 'try', 'except', 'finally', 'with', 'lambda', 'pass', 'global', 'nonlocal', 'is', 'raise', 'yield'];
    var builtins = ['print', 'len', 'range', 'int', 'float', 'str', 'sum', 'max', 'min', 'sorted', 'list', 'dict', 'set', 'tuple', 'type', 'input', 'abs', 'round', 'enumerate', 'zip', 'append', 'strip', 'upper', 'lower', 'split', 'replace', 'join', 'count', 'pop', 'remove', 'insert', 'extend', 'get', 'items', 'keys', 'values'];
    var html = '';
    var i = 0;

    function escapeToken(text) {
      return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    while (i < code.length) {
      var ch = code[i];

      if (ch === '#') {
        var commentEnd = code.indexOf('\n', i);
        if (commentEnd === -1) commentEnd = code.length;
        html += '<span class="tok-com">' + escapeToken(code.slice(i, commentEnd)) + '</span>';
        i = commentEnd;
        continue;
      }

      if (ch === '"' || ch === "'") {
        var quote = ch;
        var end = i + 1;
        if (code.slice(i, i + 3) === quote + quote + quote) {
          end = i + 3;
          while (end < code.length && code.slice(end, end + 3) !== quote + quote + quote) end++;
          end = Math.min(code.length, end + 3);
        } else {
          while (end < code.length) {
            if (code[end] === '\\') { end += 2; continue; }
            if (code[end] === quote) { end++; break; }
            if (code[end] === '\n') break;
            end++;
          }
        }
        html += '<span class="tok-str">' + escapeToken(code.slice(i, end)) + '</span>';
        i = end;
        continue;
      }

      if (/[0-9]/.test(ch)) {
        var numberEnd = i + 1;
        while (numberEnd < code.length && /[0-9._]/.test(code[numberEnd])) numberEnd++;
        html += '<span class="tok-num">' + escapeToken(code.slice(i, numberEnd)) + '</span>';
        i = numberEnd;
        continue;
      }

      if (/[A-Za-z_]/.test(ch)) {
        var wordEnd = i + 1;
        while (wordEnd < code.length && /[A-Za-z0-9_]/.test(code[wordEnd])) wordEnd++;
        var word = code.slice(i, wordEnd);
        var tokenClass = keywords.indexOf(word) !== -1 ? 'tok-kw' : (builtins.indexOf(word) !== -1 ? 'tok-fn' : '');
        html += tokenClass ? '<span class="' + tokenClass + '">' + escapeToken(word) + '</span>' : escapeToken(word);
        i = wordEnd;
        continue;
      }

      html += escapeToken(ch);
      i++;
    }
    return html;
  }

  function showToast(message) {
    var el = document.getElementById('toast');
    el.textContent = message;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 1800);
  }

  function copyText(text, successMessage) {
    function fallbackCopy() {
      var area = document.createElement('textarea');
      area.value = text;
      area.style.position = 'fixed';
      area.style.top = '-1000px';
      area.style.opacity = '0';
      document.body.appendChild(area);
      area.focus();
      area.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (err) { ok = false; }
      document.body.removeChild(area);
      return ok;
    }

    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(function () {
        showToast(successMessage);
      }).catch(function () {
        showToast(fallbackCopy() ? successMessage : '复制失败，请手动选中复制');
      });
    } else {
      showToast(fallbackCopy() ? successMessage : '复制失败，请手动选中复制');
    }
  }

  function exportProgress() {
    updateDraftSilently();
    persist();
    var backup = {
      app: 'python-learning-demo',
      version: 1,
      exportedAt: new Date().toISOString(),
      state: state
    };
    var blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var link = document.createElement('a');
    var date = new Date();
    var month = String(date.getMonth() + 1).padStart(2, '0');
    var day = String(date.getDate()).padStart(2, '0');
    link.href = url;
    link.download = 'python-learning-progress-' + date.getFullYear() + month + day + '.json';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    setTimeout(function () { URL.revokeObjectURL(url); }, 0);
    showToast('进度备份已生成');
  }

  function importProgress(file) {
    if (!file) return;
    if (file.size > 1024 * 1024) {
      showToast('备份文件过大，无法恢复');
      return;
    }
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var parsed = JSON.parse(String(reader.result || ''));
        var incoming = parsed && parsed.state ? parsed.state : parsed;
        if (!incoming || typeof incoming !== 'object' ||
            (!incoming.completed && !incoming.drafts && !incoming.last)) {
          throw new Error('invalid progress file');
        }
        state = normalizeStoredState(incoming);
        currentIndex = state.last && POINT_INDEX.has(state.last) ? POINT_INDEX.get(state.last) : 0;
        persist();
        renderSidebar();
        renderMain();
        mainEl.scrollTop = 0;
        closeDrawer(false);
        showToast('学习进度已恢复');
      } catch (err) {
        showToast('无法识别这个进度备份');
      } finally {
        importFile.value = '';
      }
    };
    reader.onerror = function () {
      importFile.value = '';
      showToast('读取备份失败，请重试');
    };
    reader.readAsText(file);
  }

  function updateDraftSilently() {
    var editor = document.getElementById('editor');
    if (!editor) return;
    var exercise = FLAT_POINTS[currentIndex].point.exercise;
    state.drafts[exercise.id] = editor.value;
  }

  function scheduleDraftSave() {
    updateDraftSilently();
    if (saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      saveTimer = null;
      persist();
    }, 250);
  }

  function setCompleted(id, value, options) {
    options = options || {};
    if (value) state.completed[id] = true;
    else delete state.completed[id];
    persist();
    renderSidebar();
    updateMarkButton();
    var chip = document.getElementById('chapterChip');
    if (chip) {
      var chapter = FLAT_POINTS[currentIndex].chapter;
      var chapterDone = chapter.points.filter(function (p) {
        return !!state.completed[p.exercise.id];
      }).length;
      chip.textContent = '本章进度 ' + chapterDone + '/' + chapter.points.length;
    }
    if (!options.silent) showToast(value ? '已标记完成' : '已取消完成标记');
  }

  function updateMarkButton() {
    var button = document.getElementById('markBtn');
    if (!button) return;
    var exercise = FLAT_POINTS[currentIndex].point.exercise;
    var done = !!state.completed[exercise.id];
    button.classList.toggle('done', done);
    button.textContent = done ? '✓ 已完成' : '标记完成';
    button.setAttribute('aria-pressed', done ? 'true' : 'false');
  }

  function renderSidebar() {
    var total = ALL_EXERCISES.length;
    var doneTotal = ALL_EXERCISES.filter(function (exercise) {
      return !!state.completed[exercise.id];
    }).length;
    totalText.textContent = doneTotal + ' / ' + total;
    totalBar.style.width = total ? (doneTotal / total * 100) + '%' : '0%';
    if (mobileProgress) mobileProgress.textContent = doneTotal + '/' + total;
    var percent = total ? Math.round(doneTotal / total * 100) : 0;
    var progressRing = document.getElementById('progressRing');
    var ringPercent = document.getElementById('ringPercent');
    if (progressRing) progressRing.style.setProperty('--p', percent);
    if (ringPercent) ringPercent.textContent = percent + '%';
    storageNote.hidden = storageOK;

    var activeChapter = FLAT_POINTS[currentIndex].chapter;
    var html = '';
    COURSE.forEach(function (chapter, chapterIndex) {
      var chapterDone = chapter.points.filter(function (point) {
        return !!state.completed[point.exercise.id];
      }).length;
      html += '<div class="chapter' + (chapter === activeChapter ? ' active' : '') + '">';
      html += '<div class="chapter-head">';
      html += '<span class="chapter-index">' + (chapterIndex + 1) + '</span>';
      html += '<span class="chapter-name">' + chapter.title + '</span>';
      html += '<span class="chapter-count">' + chapterDone + '/' + chapter.points.length + '</span>';
      html += '</div>';
      html += '<div class="chapter-bar"><span style="width:' + (chapterDone / chapter.points.length * 100) + '%"></span></div>';
      chapter.points.forEach(function (point, pointIndex) {
        var flatIndex = POINT_INDEX.get(point.id);
        var done = !!state.completed[point.exercise.id];
        var active = flatIndex === currentIndex;

  var pythonWorker = null;
  var pythonRequest = null;
  var pythonRequestId = 0;
  var pythonEngineReady = false;

  function createPythonWorker() {
    if (pythonWorker) pythonWorker.terminate();
    var source = [
      'var enginePromise = null;',
      'self.onmessage = async function (event) {',
      '  var data = event.data;',
      '  try {',
      '    if (!enginePromise) {',
      '      self.postMessage({ id: data.id, phase: "loading" });',
      '      importScripts("https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.js");',
      '      enginePromise = loadPyodide({ indexURL: "https://cdn.jsdelivr.net/pyodide/v0.27.7/full/" });',
      '    }',
      '    var pyodide = await enginePromise;',
      '    self.postMessage({ id: data.id, phase: "running" });',
      '    var stdout = [];',
      '    var stderr = [];',
      '    pyodide.setStdout({ batched: function (text) { stdout.push(text); } });',
      '    pyodide.setStderr({ batched: function (text) { stderr.push(text); } });',
      '    await pyodide.runPythonAsync(data.code);',
      '    self.postMessage({ id: data.id, ok: true, stdout: stdout.join("\\n"), stderr: stderr.join("\\n") });',
      '  } catch (error) {',
      '    self.postMessage({ id: data.id, ok: false, error: String(error && error.message ? error.message : error) });',
      '  }',
      '};'
    ].join('\n');
    var url = URL.createObjectURL(new Blob([source], { type: 'text/javascript' }));
    pythonWorker = new Worker(url);
    URL.revokeObjectURL(url);
    pythonWorker.onmessage = function (event) {
      var data = event.data || {};
      if (!pythonRequest || data.id !== pythonRequest.id) return;
      if (data.phase) {
        updateRuntimePhase(data.phase);
        if (data.phase === 'running') pythonEngineReady = true;
        return;
      }
      clearTimeout(pythonRequest.timer);
      var resolve = pythonRequest.resolve;
      pythonRequest = null;
      resolve(data);
    };
    pythonWorker.onerror = function () {
      if (!pythonRequest) return;
      clearTimeout(pythonRequest.timer);
      var resolve = pythonRequest.resolve;
      pythonRequest = null;
      resolve({ ok: false, infrastructure: true, error: 'Python 运行组件加载失败，请检查网络后重试。' });
    };
  }

  function executePython(code) {
    if (!pythonWorker) createPythonWorker();
    if (pythonRequest) return Promise.resolve({ ok: false, infrastructure: true, error: '已有代码正在运行，请稍候。' });
    return new Promise(function (resolve) {
      var id = ++pythonRequestId;
      var timeout = pythonEngineReady ? 8000 : 35000;
      var timer = setTimeout(function () {
        if (!pythonRequest || pythonRequest.id !== id) return;
        pythonWorker.terminate();
        pythonWorker = null;
        pythonEngineReady = false;
        pythonRequest = null;
        resolve({ ok: false, timeout: true, error: '运行时间过长，已自动停止。请检查 while 条件或循环是否能结束。' });
      }, timeout);
      pythonRequest = { id: id, resolve: resolve, timer: timer };
      pythonWorker.postMessage({ id: id, code: code });
    });
  }

  function updateRuntimePhase(phase) {
    var panel = document.getElementById('runtimePanel');
    var status = document.getElementById('runtimeStatus');
    var output = document.getElementById('runtimeOutput');
    if (!panel || !status || !output) return;
    panel.hidden = false;
    status.textContent = phase === 'loading' ? '首次加载 Python…' : '正在运行…';
    output.className = 'runtime-output';
    output.textContent = phase === 'loading'
      ? '首次运行需要加载浏览器版 Python，之后通常会使用缓存。'
      : '代码正在独立环境中执行。';
  }

  function explainPythonError(errorText) {
    var text = String(errorText || '');
    var lineMatch = text.match(/line\s+(\d+)/i);
    var line = lineMatch ? Number(lineMatch[1]) : 0;
    var advice = '查看报错最后一行，它通常包含错误类型和直接原因。';
    if (/IndentationError|TabError/.test(text)) advice = '缩进有问题。检查报错行及上一行，代码块通常统一缩进 4 个空格。';
    else if (/SyntaxError/.test(text)) advice = '语法不完整。重点检查报错行附近的冒号、括号、引号和拼写。';
    else if (/NameError/.test(text)) advice = '使用了尚未定义的名称。检查变量或函数的拼写，以及是否在使用前赋值。';
    else if (/TypeError/.test(text)) advice = '数据类型或参数不匹配。检查传入值的类型和函数参数数量。';
    else if (/ZeroDivisionError/.test(text)) advice = '出现除以零。计算前应判断分母是否为 0。';
    else if (/IndexError/.test(text)) advice = '列表下标超出范围。可先用 len() 检查列表长度。';
    else if (/KeyError/.test(text)) advice = '字典中没有这个键。不确定键是否存在时可以使用 get()。';
    return { line: line, advice: advice };
  }

  function showRuntime(result) {
    var panel = document.getElementById('runtimePanel');
    var status = document.getElementById('runtimeStatus');
    var output = document.getElementById('runtimeOutput');
    var help = document.getElementById('runtimeHelp');
    if (!panel || !status || !output || !help) return;
    panel.hidden = false;
    if (result.ok) {
      status.textContent = '运行完成';
      output.className = 'runtime-output';
      output.textContent = (result.stdout || result.stderr || '').trim() || '（程序运行成功，但没有输出）';
      help.hidden = true;
      help.textContent = '';
    } else {
      var info = explainPythonError(result.error);
      status.textContent = result.timeout ? '已停止' : '运行出错';
      output.className = 'runtime-output error';
      output.textContent = result.error || '未知运行错误';
      help.hidden = false;
      help.textContent = (info.line ? '第 ' + info.line + ' 行附近：' : '') + info.advice;
      if (info.line) focusEditorLine(info.line);
    }
  }

  function focusEditorLine(lineNumber) {
    var editor = document.getElementById('editor');
    if (!editor || lineNumber < 1) return;
    var lines = editor.value.split('\n');
    var start = 0;
    for (var i = 0; i < lineNumber - 1 && i < lines.length; i++) start += lines[i].length + 1;
    var end = start + (lines[lineNumber - 1] || '').length;
    editor.focus();
    editor.setSelectionRange(start, end);
  }

  function setRunBusy(busy) {
    ['runBtn', 'checkBtn'].forEach(function (id) {
      var button = document.getElementById(id);
      if (button) button.disabled = busy;
    });
  }

  async function runOnly() {
    var editor = document.getElementById('editor');
    if (!editor || !editor.value.trim()) {
      showRuntime({ ok: false, infrastructure: true, error: '编辑区是空的，请先写代码。' });
      return;
    }
    setRunBusy(true);
    var result = await executePython(editor.value);
    setRunBusy(false);
    showRuntime(result);
  }

  function normalizeOutput(value) {
    return String(value == null ? '' : value)
      .replace(/\\n/g, '\n')
      .replace(/\r\n?/g, '\n')
      .split('\n')
      .map(function (line) { return line.replace(/[ \t]+$/g, ''); })
      .join('\n')
      .trim();
  }

  function normalizeCode(code) {
    return String(code)
      .replace(/\r\n?/g, '\n')
      .split('\n')
      .map(function (line) { return line.replace(/#.*$/, ''); })
      .join('\n');
  }

  async function runCheck() {
    var editor = document.getElementById('editor');
    if (!editor) return;
    var exercise = FLAT_POINTS[currentIndex].point.exercise;
    var clean = normalizeCode(editor.value);
    var box = document.getElementById('result');
    box.hidden = false;

    if (!clean.trim()) {
      box.className = 'result result-warn';
      box.innerHTML = '<div class="result-title">先写点代码再检查</div>' +
        '<p class="result-explain">编辑区现在是空的。照着上面的示例写几行，再点“检查答案”。</p>';
      return;
    }

    setRunBusy(true);
    var runtime = await executePython(editor.value);
    setRunBusy(false);
    showRuntime(runtime);
    if (!runtime.ok) {
      box.className = 'result result-bad';
      box.innerHTML = '<div class="result-title">代码还没有成功运行</div>' +
        '<p class="result-explain">先根据上方真实报错修改代码。程序能运行后，系统才会继续核对答案。</p>';
      return;
    }

    var outputMatches = normalizeOutput(runtime.stdout) === normalizeOutput(exercise.expected);
    var checks = [{ label: '真实运行输出与预期结果一致', ok: outputMatches }].concat(exercise.checks.map(function (check) {
      var ok = false;
      try { ok = !!check.test(clean); } catch (err) { ok = false; }
      return { label: check.label, ok: ok };
    }));
    var passed = checks.every(function (check) { return check.ok; });
    var failedCount = checks.filter(function (check) { return !check.ok; }).length;

    if (passed) {
      box.className = 'result result-ok';
      box.innerHTML =
        '<div class="result-title">检查通过，本题已标记完成</div>' +
        '<ul class="check-list">' + checks.map(function (check) {
          return '<li class="ok">✓ ' + escapeHtml(check.label) + '</li>';
        }).join('') + '</ul>' +
        '<p class="result-explain"><strong>为什么这样写：</strong>' + exercise.explain + '</p>' +
        (currentIndex < FLAT_POINTS.length - 1
          ? '<button class="btn result-next" id="nextFromResult" type="button">下一节 →</button>'
          : '<p class="result-explain">所有知识点都学完了，可以回到任意一节复习。</p>');
      var nextFromResult = document.getElementById('nextFromResult');
      if (nextFromResult) {
        nextFromResult.addEventListener('click', function () { goTo(currentIndex + 1); });
      }
      setCompleted(exercise.id, true, { silent: true });
    } else {
      box.className = 'result result-bad';
      box.innerHTML =
        '<div class="result-title">还差 ' + failedCount + ' 项，再改改</div>' +
        '<ul class="check-list">' + checks.map(function (check) {
          return '<li class="' + (check.ok ? 'ok' : 'bad') + '">' + (check.ok ? '✓' : '✗') + ' ' + escapeHtml(check.label) + '</li>';
        }).join('') + '</ul>' +
        '<p class="result-explain">提示：' + exercise.hint + '</p>' +
        (outputMatches ? '' : '<p class="result-explain"><strong>实际输出：</strong><br><code>' + escapeHtml(normalizeOutput(runtime.stdout) || '（无输出）') + '</code><br><strong>预期输出：</strong><br><code>' + escapeHtml(normalizeOutput(exercise.expected)) + '</code></p>') +
        '<p class="result-explain">系统已经真实运行代码，并继续检查是否使用了本题要求的知识点。对照失败项逐个修改即可。</p>';
    }
  }

  function resetEditor() {
    var exercise = FLAT_POINTS[currentIndex].point.exercise;
    var editor = document.getElementById('editor');
    editor.value = exercise.starter;
    state.drafts[exercise.id] = exercise.starter;
    persist();
    var box = document.getElementById('result');
    box.hidden = true;
    box.innerHTML = '';
    var runtimePanel = document.getElementById('runtimePanel');
    if (runtimePanel) runtimePanel.hidden = true;
    editor.focus();
    showToast('已重置为初始代码');
  }

  function handleEditorKeydown(event) {
    var editor = event.currentTarget;
    var start = editor.selectionStart;
    var end = editor.selectionEnd;
    var value = editor.value;

    if (event.key === 'Tab') {
      event.preventDefault();
      if (!event.shiftKey) {
        if (start === end) {
          editor.value = value.slice(0, start) + '    ' + value.slice(end);
          editor.selectionStart = editor.selectionEnd = start + 4;
        } else {
          var lineStart = value.lastIndexOf('\n', start - 1) + 1;
          var segment = value.slice(lineStart, end);
          var replaced = segment.replace(/^/gm, '    ');
          editor.value = value.slice(0, lineStart) + replaced + value.slice(end);
          editor.selectionStart = lineStart;
          editor.selectionEnd = end + (replaced.length - segment.length);
        }
      } else {
        var unindentStart = value.lastIndexOf('\n', start - 1) + 1;
        var lineEnd = start === end ? (value.indexOf('\n', end) === -1 ? value.length : value.indexOf('\n', end)) : end;
        var block = value.slice(unindentStart, lineEnd);
        var unindented = block.replace(/^ {1,4}/gm, '');
        var removed = block.length - unindented.length;
        editor.value = value.slice(0, unindentStart) + unindented + value.slice(lineEnd);
        editor.selectionStart = Math.max(unindentStart, start - Math.min(4, start - unindentStart));
        editor.selectionEnd = Math.max(editor.selectionStart, end - removed);
      }
      scheduleDraftSave();
      return;
    }

    if (event.key === 'Enter' && !event.shiftKey && !event.ctrlKey && !event.metaKey && !event.altKey) {
      var before = value.slice(0, start);
      var lineStart = before.lastIndexOf('\n') + 1;
      var line = before.slice(lineStart);
      var indentMatch = line.match(/^[ \t]*/);
      var indent = indentMatch ? indentMatch[0] : '';
      var extra = line.trimEnd().endsWith(':') ? '    ' : '';
      if (indent || extra) {
        event.preventDefault();
        var insert = '\n' + indent + extra;
        editor.value = value.slice(0, start) + insert + value.slice(end);
        var cursor = start + insert.length;
        editor.selectionStart = editor.selectionEnd = cursor;
        scheduleDraftSave();
      }
      return;
    }

    if ((event.ctrlKey || event.metaKey) && event.key === 'Enter') {
      event.preventDefault();
      runOnly();
    }
  }

  function goTo(index) {
    if (index < 0 || index >= FLAT_POINTS.length) return;
    if (index === currentIndex) {
      mainEl.scrollTop = 0;
      return;
    }
    updateDraftSilently();
    currentIndex = index;
    state.last = FLAT_POINTS[index].point.id;
    persist();
    renderSidebar();
    renderMain();
    mainEl.scrollTop = 0;
  }

  clearBtn.addEventListener('click', function () {
    if (!clearArmed) {
      clearArmed = true;
      clearBtn.textContent = '再点一次确认清空';
      clearBtn.classList.add('armed');
      clearTimer = setTimeout(function () {
        clearArmed = false;
        clearBtn.textContent = '清空进度';
        clearBtn.classList.remove('armed');
      }, 3000);
      return;
    }
    clearTimeout(clearTimer);
    clearArmed = false;
    clearBtn.textContent = '清空进度';
    clearBtn.classList.remove('armed');
    state.completed = {};
    state.drafts = {};
    state.last = null;
    currentIndex = 0;
    persist();
    renderSidebar();
    renderMain();
    showToast('已清空进度和草稿');
  });

  if (exportBtn) {
    exportBtn.addEventListener('click', exportProgress);
  }
  if (importBtn && importFile) {
    importBtn.addEventListener('click', function () { importFile.click(); });
    importFile.addEventListener('change', function () {
      importProgress(importFile.files && importFile.files[0]);
    });
  }

  if (menuBtn) {
    menuBtn.addEventListener('click', function () {
      if (sidebarEl.classList.contains('open')) closeDrawer(true);
      else openDrawer();
    });
  }
  if (drawerClose) {
    drawerClose.addEventListener('click', function () { closeDrawer(true); });
  }
  if (backdrop) {
    backdrop.addEventListener('click', function () { closeDrawer(true); });
  }
  document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape') closeDrawer(true);
  });
  window.addEventListener('resize', function () {
    if (!isMobileLayout()) closeDrawer(false);
  });

  window.addEventListener('beforeunload', function () {
    updateDraftSilently();
    persist();
  });

  renderSidebar();
  renderMain();
</script>
</body>
</html>
